# ==============================================================================
# Tinarchy / Pinedash Server tmux Configuration
# ==============================================================================

# ─── Prefix Key ──────────────────────────────────────────────────────────────
# Change prefix key to Ctrl+Space for fast, ergonomic key reach
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ─── General Options ─────────────────────────────────────────────────────────
# Enable mouse mode (smooth scrolling with trackpad/mouse, click to select pane)
set -g mouse on

# Eliminate Esc key delay for instant modal switching (Vim/Neovim)
set -s escape-time 0

# Support 256 colors & truecolor RGB in modern terminal emulators
set -g default-terminal "xterm-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Generous history scrollback (50,000 lines)
set -g history-limit 50000

# Window index starts at 1 for natural physical reach across number keys
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Prevent programs from overriding custom window titles
set-option -g allow-rename off

# ─── Pinedash Themed Status Bar ──────────────────────────────────────────────
set -g status-position bottom
set -g status-interval 5
set -g status-bg '#11151a'
set -g status-fg '#c5d1de'

# Left status: Session name badge
set -g status-left '#[fg=#0b0f14,bg=#69B4C3,bold] 🚀 #S #[bg=#11151a,fg=#69B4C3] '
set -g status-left-length 30

# Right status: Host identity & timestamp
set -g status-right '#[fg=#69B4C3,bg=#11151a]#H #[fg=#0b0f14,bg=#69B4C3,bold] %H:%M #[default]'
set -g status-right-length 50

# Window tabs formatting
set -g window-status-current-format '#[fg=#69B4C3,bg=#1c232d,bold] [#I: #W] '
set -g window-status-format '#[fg=#7c8b9d,bg=#11151a] #I: #W '

# Pane border styling
set -g pane-border-style fg='#202934'
set -g pane-active-border-style fg='#69B4C3'
