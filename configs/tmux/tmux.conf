# ==============================================================================
# Tinarchy / Pinedash Server tmux Configuration
# ==============================================================================

# ─── Prefix Key ──────────────────────────────────────────────────────────────
# Change prefix key to Ctrl+Space for fast, ergonomic key reach
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ─── General Options ─────────────────────────────────────────────────────────
# Enable mouse mode (smooth scrolling with trackpad/mouse, click to select pane)
set -g mouse on

# Eliminate Esc key delay for instant modal switching (Vim/Neovim)
set -s escape-time 0

# Support 256 colors & truecolor RGB in modern terminal emulators
set -g default-terminal "xterm-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",*256col*:RGB"
set -ag terminal-overrides ",xterm-kitty:RGB"
set -ag terminal-overrides ",alacritty:RGB"
set -ag terminal-overrides ",ghostty:RGB"
set -ag terminal-overrides ",foot:RGB"

# Generous history scrollback (50,000 lines)
set -g history-limit 50000

# Window index starts at 1 for natural physical reach across number keys
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g aggressive-resize on
set -g window-size latest

# Prevent programs from overriding custom window titles
set-option -g allow-rename off

# ─── Minimal Pink Top Status Bar ─────────────────────────────────────────────
set -g status-position top
set -g status-interval 5
set -g status-justify left

# Sleek dark backdrop with clean typography
set -g status-style "bg=#141218,fg=#f2e9ee"

# Left status: Clean minimal session name badge
set -g status-left "#[fg=#ff79c6,bold] #S #[fg=#4a4055]│ "
set -g status-left-length 30

# Right status: Clean timestamp and host identity
set -g status-right "#[fg=#8a7f96]%H:%M #[fg=#4a4055]│ #[fg=#ff79c6]#h "
set -g status-right-length 50

# Window tabs: Minimal active dot & clean inactive style
set -g window-status-current-format "#[fg=#ff79c6,bold]● #I:#W"
set -g window-status-format "#[fg=#72697e]○ #I:#W"
set -g window-status-separator "  "

# Pane borders: Subtle dividers with vibrant pink active highlight
set -g pane-border-style "fg=#26202e"
set -g pane-active-border-style "fg=#ff79c6"

# Command prompt & copy mode styling
set -g message-style "bg=#ff79c6,fg=#141218,bold"
set -g message-command-style "bg=#ff79c6,fg=#141218,bold"
set -g mode-style "bg=#ff79c6,fg=#141218,bold"

# Clock mode
set -g clock-mode-colour "#ff79c6"
