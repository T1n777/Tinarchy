# ==============================================================================
# Tinarchy / Pinedash Server tmux Configuration
# ==============================================================================

# ─── Prefix Key ──────────────────────────────────────────────────────────────
# Change prefix key to Ctrl+Space for fast, ergonomic key reach
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ─── General Options ─────────────────────────────────────────────────────────
# Enable mouse mode (smooth scrolling with trackpad/mouse, click to select pane)
set -g mouse on

# Eliminate Esc key delay for instant modal switching (Vim/Neovim)
set -s escape-time 0

# Support 256 colors & truecolor RGB in modern terminal emulators
set -g default-terminal "xterm-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",*256col*:RGB"
set -ag terminal-overrides ",xterm-kitty:RGB"
set -ag terminal-overrides ",alacritty:RGB"
set -ag terminal-overrides ",ghostty:RGB"
set -ag terminal-overrides ",foot:RGB"

# Generous history scrollback (50,000 lines)
set -g history-limit 50000

# Window index starts at 1 for natural physical reach across number keys
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g aggressive-resize on
set -g window-size latest

# Prevent programs from overriding custom window titles
set-option -g allow-rename off

# Default shell: fish
set -g default-shell /usr/bin/fish

# ─── Pastel Pink Minimal Top Status Bar (Matugen Matched) ───────────────────
# Seamless transparent backdrop that matches the terminal's native background
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=default,fg=#a08b93"

# Left: session name in soft Matugen pastel pink
set -g status-left "#[fg=#ffafd3,bold]#S  "
set -g status-left-length 20

# Windows: current in pastel pink, others in muted Matugen tone
set -g window-status-current-format "#[fg=#ffafd3,bold]#I:#W"
set -g window-status-format "#[fg=#a08b93]#I:#W"
set -g window-status-separator "  "

# Right: minimal timestamp
set -g status-right "#[fg=#a08b93]%H:%M"
set -g status-right-length 20

# Pane borders: subtle border with pastel pink active highlight
set -g pane-border-style "fg=#534249"
set -g pane-active-border-style "fg=#ffafd3"

# Prompts & selection
set -g message-style "bg=default,fg=#ffafd3"
set -g message-command-style "bg=default,fg=#ffafd3"
set -g mode-style "bg=#ffafd3,fg=#191114"

# Clock mode
set -g clock-mode-colour "#ffafd3"
