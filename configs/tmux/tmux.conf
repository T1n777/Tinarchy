# ==============================================================================
# Tinarchy / Pinedash Server tmux Configuration
# ==============================================================================

# ─── Prefix Key ──────────────────────────────────────────────────────────────
# Change prefix key to Ctrl+Space for fast, ergonomic key reach
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ─── General Options ─────────────────────────────────────────────────────────
# Enable mouse mode (smooth scrolling with trackpad/mouse, click to select pane)
set -g mouse on

# Eliminate Esc key delay for instant modal switching (Vim/Neovim)
set -s escape-time 0

# Support 256 colors, truecolor RGB, and modern terminal features
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-features ",*:sync"          # Synchronized output (mode 2026): batches redraws to prevent SSH lag/tearing
set -as terminal-features ",*:clipboard"     # OSC 52 clipboard support
set -g allow-passthrough on                  # Enable OSC escape sequence passthrough
set -s set-clipboard on

# Optimized history scrollback (10,000 lines avoids memory bloat and scrollback lag)
set -g history-limit 10000

# Quick shortcut to clear pane scrollback buffer on demand (Prefix + K or Prefix + C-l)
bind K clear-history
bind C-l send-keys C-l \; run 'sleep 0.05' \; clear-history

# Window index starts at 1 for natural physical reach across number keys
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g aggressive-resize off
set -g window-size latest

# Prevent programs from overriding custom window titles
set-option -g allow-rename off

# Default shell: fish
set -g default-shell /usr/bin/fish

# ─── Clean Minimal Pastel Pink Status Bar (GitHub / niksingh710 inspired) ────
# Transparent background with absolute-centered window tabs and zero polling
set -g status-position top
set -g status-interval 0
set -g status-justify absolute-centre
set -g status-style "bg=default,fg=default"

# Left: Pastel pink session pill (glows with bold indicator when prefix is active)
set -g status-left "#{?client_prefix,#[bg=#ffafd3,fg=#191114,bold] 󰘳 PREFIX #[default],#[bg=#ffafd3,fg=#191114,bold] #S #[default]}"
set -g status-left-length 30

# Center: Soft pastel mauve inactive tabs & glowing pastel pink active pill
set -g window-status-format "#[fg=#d4b2be] #I:#W "
set -g window-status-current-format "#[bg=#ffafd3,fg=#191114,bold] #I:#W #{?window_zoomed_flag,󰊓 ,}#[default]"
set -g window-status-separator " "

# Right: Pastel pink hostname pill (clean, static, zero background redraws)
set -g status-right "#[bg=#ffafd3,fg=#191114,bold] #h #[default]"
set -g status-right-length 30

# Pane borders: subtle border with pastel pink active highlight
set -g pane-border-style "fg=#534249"
set -g pane-active-border-style "fg=#ffafd3"

# Prompts & selection in pastel pink
set -g message-style "bg=default,fg=#ffafd3,bold"
set -g message-command-style "bg=default,fg=#ffafd3,bold"
set -g mode-style "bg=#ffafd3,fg=#191114,bold"

# Clock mode
set -g clock-mode-colour "#ffafd3"
