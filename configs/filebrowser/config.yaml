server:
  port: 8082
  listen: "127.0.0.1"
  baseURL: "/"
  database: "/home/pineapple/drive/.filebrowser.db"
  cacheDir: "/home/pineapple/drive/.cache"
  cacheDirCleanup: true
  minSearchLength: 2
  numImageProcessors: 4
  maxArchiveSize: 0
  sources:
    - path: "/home/pineapple/drive"
      name: "drive"
      config:
        defaultEnabled: true
    - path: "/home/pineapple/Wall"
      name: "wallpapers"
      config:
        defaultEnabled: true
    - path: "/var/lib/suwayomi/downloads"
      name: "manga"
      config:
        defaultEnabled: true

auth:
  adminUsername: "pineapple"
  adminPassword: "admin_password"
  methods:
    password:
      enabled: true
      minLength: 4
      signup: false
    passkey:
      enabled: true
