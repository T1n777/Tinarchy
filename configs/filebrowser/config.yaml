server:
  port: 8082
  listen: "127.0.0.1"
  baseURL: "/"
  database: "/home/tin/drive/.filebrowser.db"
  cacheDir: "/home/tin/drive/.cache"
  cacheDirCleanup: true
  minSearchLength: 2
  numImageProcessors: 4
  maxArchiveSize: 0
  sources:
    - path: "/"
      name: "root"
      config:
        defaultEnabled: true

auth:
  adminUsername: "tin"
  adminPassword: "admin"
  methods:
    password:
      enabled: true
      minLength: 4
      signup: false
    passkey:
      enabled: true
