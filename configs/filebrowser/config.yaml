server:
  port: 8082
  listen: "127.0.0.1"
  baseURL: "/"
  database: "/home/tin/drive/.filebrowser.db"
  cacheDir: "/home/tin/drive/.cache"
  cacheDirCleanup: true
  minSearchLength: 2
  numImageProcessors: 4
  maxArchiveSize: 0
  sources:
    - path: "/"
      name: "root"
      config:
        defaultEnabled: true
    - path: "/home/pineapple"
      name: "home"
      config:
        defaultEnabled: true

auth:
  methods:
    noauth: true
    password:
      enabled: false
      minLength: 4
      signup: false
    passkey:
      enabled: false
