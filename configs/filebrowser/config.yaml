server:
  port: 8082
  listen: "127.0.0.1"
  baseURL: "/files"
  database: "/home/tin/drive/.filebrowser.db"
  cacheDir: "/home/tin/drive/.cache"
  cacheDirCleanup: true
  minSearchLength: 2
  numImageProcessors: 4
  maxArchiveSize: 0
  sources:
    - path: "/home/tin"
      name: "drive"
      config:
        defaultEnabled: true
    - path: "/var/lib/suwayomi/.local/share/Tachidesk/downloads"
      name: "manga"
      config:
        defaultEnabled: false

auth:
  methods:
    password:
      enabled: true
      minLength: 4
      signup: false
    passkey:
      enabled: true
