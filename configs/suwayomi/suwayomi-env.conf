# Universal container-aware memory allocation: preallocates 20% (~1.5 GB), scales up to 40% (~3.0 GB)
JAVA_ARGS="-XX:InitialRAMPercentage=20.0 -XX:MaxRAMPercentage=40.0 -XX:+UseG1GC -XX:+UseStringDeduplication -XX:+OptimizeStringConcat -XX:G1ReservePercent=15 -XX:InitiatingHeapOccupancyPercent=45 -XX:+ParallelRefProcEnabled"
TACHIDESK_ROOT_DIR="/var/lib/suwayomi"
