# Universal container-aware memory allocation: preallocates 35% (~2.7 GB), scales up to 60% (~4.6 GB)
JAVA_ARGS="-XX:InitialRAMPercentage=35.0 -XX:MaxRAMPercentage=60.0 -XX:+UseG1GC -XX:+UseStringDeduplication -XX:+OptimizeStringConcat -XX:G1ReservePercent=15 -XX:InitiatingHeapOccupancyPercent=45 -XX:+ParallelRefProcEnabled"
TACHIDESK_ROOT_DIR="/var/lib/suwayomi"
