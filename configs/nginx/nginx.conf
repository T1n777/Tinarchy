user pineapple pineapple;
worker_processes auto;
worker_cpu_affinity auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 4096;

    # Suwayomi Manga Thumbnail Fast-Path Proxy Cache Zone
    proxy_cache_path /var/cache/nginx/suwayomi levels=1:2 keys_zone=suwayomi_cache:10m max_size=2g inactive=30d use_temp_path=off;


    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    map $http_authorization $final_auth {
        default $http_authorization;
        ""      "Basic <COUCHDB_BASE64_CREDENTIALS>";
    }

    # ─── 1. Port 80 & 8080 HTTP: Direct HTTP & Tailscale Access ───
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;

        client_max_body_size 20G;

        # Obsidian LiveSync CouchDB
        location /couchdb/ {
            proxy_pass http://127.0.0.1:5984/;
            proxy_redirect off;
            proxy_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $final_auth;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            client_max_body_size 250M;
        }

        # FileBrowser Quantum Web File Manager
        location /files/ {
            mirror /internal_drive_sync;
            proxy_pass http://127.0.0.1:8082;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            client_max_body_size 20G;
        }

        # Suwayomi Manga Thumbnail Caching (Zero-JVM Fast-Path)
        location ~ ^/manga/api/v1/manga/([0-9]+)/thumbnail$ {
            proxy_pass http://127.0.0.1:4567;
            proxy_cache suwayomi_cache;
            proxy_cache_valid 200 30d;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 15s;
            add_header X-Cache-Status $upstream_cache_status always;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Suwayomi Manga Reader UI
        location /manga/ {
            proxy_pass http://127.0.0.1:4567/manga/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Accept-Encoding "";
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;

            # Auto-sync beacon on page close/hide & open
            sub_filter '</head>' '<script>window.addEventListener("pagehide",function(){navigator.sendBeacon("/api/suwayomi/sync");});</script></head>';
            sub_filter_once on;
        }

        # SyncYomi Manga Sync Server
        location /syncyomi/ {
            proxy_pass http://127.0.0.1:8282/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            client_max_body_size 64M;
        }

        # Suwayomi Manga API
        location /api/v1/ {
            proxy_pass http://127.0.0.1:4567/manga/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Drive Sync Mirror Hook
        location = /internal_drive_sync {
            internal;
            proxy_pass http://127.0.0.1:8085/api/drive/sync;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
        }

        # Syncthing Setup Guide
        location = /syncthing {
            proxy_pass http://127.0.0.1:8085/syncthing;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Syncthing Continuous Sync Web GUI
        location /syncthing/ {
            proxy_pass http://127.0.0.1:8384/;
            proxy_set_header Host 127.0.0.1;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400s;
        }

        # Dashboard Backend & Frontend
        location / {
            proxy_pass http://127.0.0.1:8085;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

