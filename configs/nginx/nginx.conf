user tin tin;
worker_processes auto;
worker_cpu_affinity auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 4096;

    # Suwayomi Manga Thumbnail Fast-Path Proxy Cache Zone
    proxy_cache_path /var/cache/nginx/suwayomi levels=1:2 keys_zone=suwayomi_cache:10m max_size=2g inactive=60d use_temp_path=off;

    # Jellyfin Artwork & Static WebUI Cache Zone
    proxy_cache_path /var/cache/nginx/jellyfin levels=1:2 keys_zone=jellyfin_cache:64m max_size=10g inactive=30d use_temp_path=off;



    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }


    upstream suwayomi_backend {
        server 127.0.0.1:4567;
        keepalive 64;
    }

    upstream seerr_backend {
        server 127.0.0.1:5054;
        keepalive 32;
        keepalive_requests 10000;
        keepalive_timeout 60s;
    }

        upstream qbittorrent_backend {
        server 127.0.0.1:8084;
        keepalive 32;
        keepalive_requests 10000;
        keepalive_timeout 60s;
    }

    upstream jellyfin_backend {
        server 127.0.0.1:8095;
        keepalive 64;
        keepalive_requests 10000;
        keepalive_timeout 60s;
    }

    upstream bazarr_backend {
        server 127.0.0.1:6767;
        keepalive 32;
        keepalive_requests 10000;
        keepalive_timeout 60s;
    }

    upstream vaultwarden_backend {
        server 127.0.0.1:8001;
        keepalive 32;
        keepalive_requests 10000;
        keepalive_timeout 60s;
    }




    map $http_authorization $final_auth {
        default $http_authorization;
        ""      "Basic YWRtaW46MjUwNw==";
    }

    # ─── 1. Port 80 & 8080 HTTP: Direct HTTP & Tailscale Access ───
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;

        client_max_body_size 20G;

        # Obsidian LiveSync CouchDB
        location /couchdb/ {
            proxy_pass http://127.0.0.1:5984/;
            proxy_redirect off;
            proxy_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $final_auth;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            client_max_body_size 250M;
        }

        # FileBrowser Quantum Web File Manager
        location /files/ {
            mirror /internal_drive_sync;
            proxy_pass http://127.0.0.1:8082;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            client_max_body_size 20G;
        }

        # Suwayomi Manga Thumbnail Fast-Path (Optimized WebP Static + Dynamic Fallback)
        location ~ ^/(?:manga/)?api/v1/manga/([0-9]+)/thumbnail$ {
            set $manga_id $1;
            root /var/lib/suwayomi/cache;
            try_files /optimized_thumbnails/$manga_id.webp @suwayomi_dynamic_thumbnail;

            default_type "image/webp";
            add_header Cache-Control "public, max-age=5184000, immutable" always;
            add_header X-Thumbnail-Engine "OPTIMIZED-STATIC-FASTPATH" always;
        }

        location @suwayomi_dynamic_thumbnail {
            proxy_pass http://127.0.0.1:8085/api/suwayomi/thumbnail/$manga_id$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";

            add_header Cache-Control "public, max-age=5184000, immutable" always;
            add_header X-Thumbnail-Engine "ON-DEMAND-DYNAMIC-OPTIMIZER" always;
        }

        # Suwayomi Private Vault Extension
        location = /suwayomi-vault.js {
            alias /home/tin/server-dashboard/public/suwayomi-vault.js;
            default_type application/javascript;
            add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        # Suwayomi Manga Reader UI
        location /manga/ {
            proxy_pass http://127.0.0.1:4567/manga/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Accept-Encoding "";
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            sub_filter '</head>' '<script src="/suwayomi-vault.js?v=20260925sync"></script></head>';
            sub_filter_once on;
        }

        # SyncYomi Manga Sync Server
        location /syncyomi/ {
            proxy_pass http://127.0.0.1:8282/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            client_max_body_size 64M;
        }

        # Suwayomi Manga API
        location /api/v1/ {
            proxy_pass http://127.0.0.1:4567/manga/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Drive Sync Mirror Hook
        location = /internal_drive_sync {
            internal;
            proxy_pass http://127.0.0.1:8085/api/drive/sync;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
        }

        # Syncthing Setup Guide
        location = /syncthing {
            proxy_pass http://127.0.0.1:8085/syncthing;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Syncthing Continuous Sync Web GUI
        location /syncthing/ {
            proxy_pass http://127.0.0.1:8384/;
            proxy_set_header Host 127.0.0.1;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400s;
        }

        # qBittorrent Web UI
        location = /qbittorrent {
            return 301 /qbittorrent/;
        }

        location /qbittorrent/ {
            proxy_pass http://qbittorrent_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host 127.0.0.1:8084;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_cookie_path / /qbittorrent/;
        }
        # Bazarr Subtitles Management Web UI
        location = /bazarr {
            return 301 /bazarr/;
        }

        location /bazarr/ {
            proxy_pass http://bazarr_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }



        # Vaultwarden Bitwarden Shortcut
        location ~ ^/(?:vault|vaultwarden|bitwarden)/?$ {
            return 302 https://$host:8000/;
        }

        # Dashboard Backend & Frontend
        location / {
            proxy_pass http://127.0.0.1:8085;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

