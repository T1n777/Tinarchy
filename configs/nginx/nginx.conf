            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400s;
        }

        # Dashboard Backend & Frontend
        location / {
            proxy_pass http://127.0.0.1:8085;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }



    # ─── 5. Port 4567 HTTPS: Suwayomi Manga Reader with Let's Encrypt & SAN SSL ───
    server {
        listen 4567 ssl default_server;
        listen [::]:4567 ssl default_server;
        http2 on;

        ssl_certificate /home/pineapple/Tinarchy/ssl/server-fullchain.crt;
        ssl_certificate_key /home/pineapple/Tinarchy/ssl/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        error_page 497 =301 https://$http_host$request_uri;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        client_max_body_size 500M;

        location / {
            proxy_pass http://127.0.0.1:4566;
