    # ─── 6. Port 8096 HTTPS: Jellyfin Media Server with Let's Encrypt & SAN SSL ───
    server {
        listen 8096 ssl default_server;
        listen [::]:8096 ssl default_server;
        http2 on;

        ssl_certificate /home/pineapple/Tinarchy/ssl/server-fullchain.crt;
        ssl_certificate_key /home/pineapple/Tinarchy/ssl/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
