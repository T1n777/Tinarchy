        http2 on;
        server_name pineapple-station.taildb42a2.ts.net;

        ssl_certificate /home/pineapple/pineapple-station.taildb42a2.ts.net.crt;
        ssl_certificate_key /home/pineapple/pineapple-station.taildb42a2.ts.net.key;
        ssl_protocols TLSv1.2 TLSv1.3;
