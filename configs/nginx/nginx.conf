user pineapple pineapple;
worker_processes auto;
worker_cpu_affinity auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 4096;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ─── 1. Strict HTTPS Enforcer: Port 80 HTTP -> 301 Redirect to HTTPS ───
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ─── 2. Port 443 HTTPS: Official Tailscale Let's Encrypt Domain (Universal Green Lock) ───
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name pineapple-station.taildb42a2.ts.net;

        ssl_certificate /home/pineapple/pineapple-station.taildb42a2.ts.net.crt;
        ssl_certificate_key /home/pineapple/pineapple-station.taildb42a2.ts.net.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;

        # Syncthing Continuous Sync Web GUI
        location /syncthing/ {
            proxy_pass http://127.0.0.1:8384/;
            proxy_set_header Host 127.0.0.1;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400s;
        }

        # Dashboard Backend & Frontend
        location / {
            proxy_pass http://127.0.0.1:8085;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # ─── 3. Port 443 HTTPS: Hostname & IP Addresses (Unified SAN Certificate) ───
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        http2 on;
        server_name 100.112.193.54 100.68.37.20 10.14.143.130 localhost "";

        ssl_certificate /home/pineapple/Tinarchy/ssl/server-fullchain.crt;
        ssl_certificate_key /home/pineapple/Tinarchy/ssl/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
