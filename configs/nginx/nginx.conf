user pineapple pineapple;
worker_processes auto;
worker_cpu_affinity auto;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 4096;
    sendfile_max_chunk 1m;

    # Client Buffers & Headers for Fast Data Transfer
    client_body_buffer_size 1m;
    client_header_buffer_size 4k;
    large_client_header_buffers 16 64k;

    # Gzip Optimization
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # High-Performance File Descriptor & In-Memory Metadata Cache
    open_file_cache max=100000 inactive=600s;
    open_file_cache_valid 300s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Extensive SSD + RAM Proxy Caching
    # 1. Suwayomi (Manhwa, Manga Chapters, Page WebP/Images, Thumbnails): 50 GB on SSD, 256 MB in RAM index
    proxy_cache_path /var/cache/nginx/suwayomi
                     levels=1:2
                     keys_zone=suwayomi_cache:256m
                     max_size=50g
                     inactive=60d
                     use_temp_path=off;

    # 2. Jellyfin (Artwork, Backdrops, Posters, Thumbnails & Static WebUI): 40 GB on SSD, 128 MB in RAM index
    proxy_cache_path /var/cache/nginx/jellyfin
                     levels=1:2
                     keys_zone=jellyfin_cache:128m
                     max_size=40g
                     inactive=30d
                     use_temp_path=off;

    proxy_cache_key "$scheme$request_method$host$request_uri";

    # ─── 1. Strict HTTPS Enforcer: Port 80 HTTP -> 301 Redirect to HTTPS ───
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ─── 2. Port 443 HTTPS: Official Tailscale Let's Encrypt Domain (Universal Green Lock) ───
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name pineapple-station.taildb42a2.ts.net;

        ssl_certificate /home/pineapple/pineapple-station.taildb42a2.ts.net.crt;
        ssl_certificate_key /home/pineapple/pineapple-station.taildb42a2.ts.net.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;

        # Syncthing Setup Guide
        location = /syncthing {
            proxy_pass http://127.0.0.1:8085/syncthing;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Syncthing Continuous Sync Web GUI
        location /syncthing/ {
            proxy_pass http://127.0.0.1:8384/;
            proxy_set_header Host 127.0.0.1;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400s;
        }

        # Dashboard Backend & Frontend
        location / {
            proxy_pass http://127.0.0.1:8085;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # ─── 3. Port 443 HTTPS: Hostname & IP Addresses (Unified SAN Certificate) ───
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        http2 on;
        server_name 100.112.193.54 100.68.37.20 10.14.143.130 localhost "";

        ssl_certificate /home/pineapple/Tinarchy/ssl/server-fullchain.crt;
        ssl_certificate_key /home/pineapple/Tinarchy/ssl/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;

        # Syncthing Setup Guide
        location = /syncthing {
            proxy_pass http://127.0.0.1:8085/syncthing;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Syncthing Continuous Sync Web GUI
        location /syncthing/ {
            proxy_pass http://127.0.0.1:8384/;
            proxy_set_header Host 127.0.0.1;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400s;
        }

        # Dashboard Backend & Frontend
        location / {
            proxy_pass http://127.0.0.1:8085;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }



    # ─── 5. Port 4567 HTTPS: Suwayomi Manga Reader with Let's Encrypt & SAN SSL ───
    server {
        listen 4567 ssl default_server;
        listen [::]:4567 ssl default_server;
        http2 on;

        ssl_certificate /home/pineapple/Tinarchy/ssl/server-fullchain.crt;
        ssl_certificate_key /home/pineapple/Tinarchy/ssl/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        error_page 497 =301 https://$http_host$request_uri;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        client_max_body_size 500M;

        # Manga chapter page streams, covers, full-covers, thumbnails & extension icons (SSD + RAM Cache)
        location ~* ^/api/v1/(manga/[0-9]+/(chapter/[0-9]+/page/[0-9]+|thumbnail|cover|full-cover)|extension/icon/) {
            proxy_pass http://127.0.0.1:4566;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;

            proxy_cache suwayomi_cache;
            proxy_cache_valid 200 206 60d;
            proxy_cache_valid 404 1m;
            proxy_ignore_headers Cache-Control Expires Set-Cookie;
            proxy_hide_header Set-Cookie;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;
            proxy_cache_revalidate on;

            proxy_buffering on;
            proxy_buffer_size 512k;
            proxy_buffers 64 256k;
            proxy_busy_buffers_size 2048k;
            proxy_temp_file_write_size 2048k;

            add_header X-Cache-Status $upstream_cache_status always;
        }

        # Static assets, WebP images, fonts & scripts
        location ~* \.(webp|jpg|jpeg|png|gif|ico|svg|css|js|woff|woff2)$ {
            proxy_pass http://127.0.0.1:4566;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;

            proxy_cache suwayomi_cache;
            proxy_cache_valid 200 206 30d;
            proxy_cache_valid 404 1m;
            proxy_ignore_headers Cache-Control Expires Set-Cookie;
            proxy_hide_header Set-Cookie;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;
            proxy_cache_revalidate on;

            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 16 256k;
            proxy_busy_buffers_size 512k;

            add_header X-Cache-Status $upstream_cache_status always;
        }

        location / {
            proxy_pass http://127.0.0.1:4566;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }

