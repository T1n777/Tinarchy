# ==============================================================================
# 💻 Memory Profile: Physical Disk Swap / Low-Swappiness
# ==============================================================================
# Engineered by Yashwanth for machines with physical swapfiles or partitions on SSD/HDD.
# Keeps active application memory in raw RAM (swappiness=30) to prevent slow disk
# thrashing while holding filesystem directory inodes in cache (vfs_cache_pressure=10).
# ==============================================================================
vm.vfs_cache_pressure = 10
vm.swappiness = 30
vm.dirty_ratio = 50
vm.dirty_background_ratio = 20
vm.dirty_expire_centisecs = 6000
vm.dirty_writeback_centisecs = 500
vm.page-cluster = 0
