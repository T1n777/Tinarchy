# ==============================================================================
# 🚀 Memory Profile: In-Memory Compressed ZRAM (Omarchy / Arch Linux)
# ==============================================================================
# Engineered for modern machines running /dev/zram0 with Zstandard (zstd) compression.
# Compresses idle background memory in RAM in nanoseconds (swappiness=150), effectively
# multiplying usable RAM by ~3.3x while bounding dirty writebacks to 256MB to prevent
# I/O write freezes during large downloads.
# ==============================================================================
vm.vfs_cache_pressure = 10
vm.swappiness = 150
vm.page-cluster = 0
vm.dirty_background_bytes = 67108864
vm.dirty_bytes = 268435456
vm.dirty_writeback_centisecs = 1500
