# High-Performance Network & Socket Buffer Acceleration (Tuned for Tinarchy & Tailscale)

# Multicore RFS (Receive Flow Steering) Socket Hash Table
net.core.rps_sock_flow_entries = 32768

# CPU SoftIRQ & Network Interrupt Budget (Tuned for Multicore Intel i5)
net.core.netdev_budget = 600
net.core.netdev_max_backlog = 10000
net.core.somaxconn = 16384
net.ipv4.tcp_max_syn_backlog = 8192

# TCP Pacing & BBR Congestion Control
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# Socket Buffer Ceilings (Expanded to 64 MB Max)
net.core.rmem_max = 67108864
net.core.wmem_max = 67108864

# Tailscale / WireGuard UDP Buffer Headroom (2 MB Default)
net.core.rmem_default = 2097152
net.core.wmem_default = 2097152

# TCP Autotuning Bounds (Min / Default / Max)
net.ipv4.tcp_rmem = 8192 262144 67108864
net.ipv4.tcp_wmem = 8192 262144 67108864

# TCP Performance & Path MTU Tuning
net.ipv4.tcp_window_scaling = 1
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_mtu_probing = 1

# TCP Keepalive Tuning
net.ipv4.tcp_keepalive_time = 120
net.ipv4.tcp_keepalive_intvl = 30
net.ipv4.tcp_keepalive_probes = 5
