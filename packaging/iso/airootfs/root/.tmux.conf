# ==============================================================================
# Tinarchy Live ISO - Pastel Pink Minimal tmux Configuration
# ==============================================================================

# Prefix Key: Ctrl+Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# General Options
set -g mouse on
set -s escape-time 0
set -g default-terminal "xterm-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",*256col*:RGB"
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g aggressive-resize on
set -g window-size latest
set-option -g allow-rename off

# Status Bar: Top, Transparent Backdrop, Pastel Pink Accent
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=default,fg=#a08b93"

# Left: Session Name in Pastel Pink
set -g status-left "#[fg=#ffafd3,bold]#S  "
set -g status-left-length 20

# Windows: Active in Pastel Pink, Inactive in Muted Grey
set -g window-status-current-format "#[fg=#ffafd3,bold]#I:#W"
set -g window-status-format "#[fg=#a08b93]#I:#W"
set -g window-status-separator "  "

# Right: Minimal Time
set -g status-right "#[fg=#a08b93]%H:%M"
set -g status-right-length 20

# Pane Borders
set -g pane-border-style "fg=#534249"
set -g pane-active-border-style "fg=#ffafd3"

# Messages & Prompts
set -g message-style "bg=default,fg=#ffafd3"
set -g message-command-style "bg=default,fg=#ffafd3"
set -g mode-style "bg=#ffafd3,fg=#191114"
set -g clock-mode-colour "#ffafd3"
