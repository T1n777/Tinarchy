<!DOCTYPE html>
<html lang="en">
<head>

    <script>
        // ─── Universal Zero-Network Wallpaper (Image & MP4 Video) & Pywal Sync Engine ───
        const DB_NAME = 'PinedashStorage';
        const STORE_NAME = 'wallpapers';

        function openLocalDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, 1);
                req.onupgradeneeded = () => req.result.createObjectStore(STORE_NAME);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function getLocalWallpaper(key = 'active_wallpaper') {
            try {
                const db = await openLocalDB();
                return new Promise((resolve) => {
                    const tx = db.transaction(STORE_NAME, 'readonly');
                    const req = tx.objectStore(STORE_NAME).get(key);
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => resolve(null);
                });
            } catch(e) { return null; }
        }

        async function saveLocalWallpaper(blob, key = 'active_wallpaper') {
            try {
                const db = await openLocalDB();
                const tx = db.transaction(STORE_NAME, 'readwrite');
                tx.objectStore(STORE_NAME).put(blob, key);
            } catch(e) { console.warn('Local caching error', e); }
        }

        function applyThemeAndColors(root, pywal) {
            if (!pywal || !pywal.colors) return;
            const pColor = pywal.colors.color4 || '#79b8ff';
            const fg = pywal.special?.foreground || '#f0f6fc';
            root.style.setProperty('--primary', pColor);
            root.style.setProperty('--primary-glow', pColor + '40');
            root.style.setProperty('--text', fg);
            root.style.setProperty('--text-muted', '#a3b3c2');
            root.style.setProperty('--glass-border', pColor + '35');
        }

        function applyMediaToBackground(mediaUrl, isVid = false) {
            const root = document.documentElement;
            const bgDiv = document.querySelector('.wallpaper');
            let vidEl = document.querySelector('.wallpaper-video');

            const isMp4 = isVid || (typeof mediaUrl === 'string' && mediaUrl.toLowerCase().includes('.mp4')) || (localStorage.getItem('dashboard-wallpaper-is-video') === 'true');

            if (isMp4) {
                if (!vidEl && bgDiv) {
                    vidEl = document.createElement('video');
                    vidEl.className = 'wallpaper-video';
                    vidEl.autoplay = true;
                    vidEl.loop = true;
                    vidEl.muted = true;
                    vidEl.playsInline = true;
                    vidEl.style.cssText = 'width:100%; height:100%; object-fit:cover; position:absolute; inset:0; pointer-events:none; z-index:-1;';
                    bgDiv.appendChild(vidEl);
                }
                if (vidEl) {
                    vidEl.style.display = 'block';
                    if (vidEl.src !== mediaUrl) vidEl.src = mediaUrl;
                    vidEl.play().catch(() => {});
                }
                if (bgDiv) bgDiv.style.backgroundImage = 'none';
            } else {
                if (vidEl) {
                    vidEl.pause();
                    vidEl.style.display = 'none';
                }
                if (bgDiv) {
                    bgDiv.style.backgroundImage = `url('${mediaUrl}')`;
                    bgDiv.style.backgroundRepeat = 'no-repeat';
                    bgDiv.style.backgroundPosition = 'center center';
                    bgDiv.style.backgroundSize = 'cover';
                }
                root.style.setProperty('--wp-url', `url('${mediaUrl}')`);
                root.style.setProperty('--login-wp-url', `url('${mediaUrl}')`);
            }
        }

        // Run synchronously before DOM render and on DOMContentLoaded
        (async function bootSync() {
            const root = document.documentElement;
            const savedTheme = localStorage.getItem('dashboard-theme') || 'glass';
            root.setAttribute('data-theme', savedTheme);
            if (document.body) {
                document.body.setAttribute('data-theme', savedTheme);
            } else {
                document.addEventListener('DOMContentLoaded', () => {
                    document.body.setAttribute('data-theme', savedTheme);
                });
            }
            
            // 1. Pywal Colors
            try {
                const pywal = JSON.parse(localStorage.getItem('dashboard-pywal') || '{}');
                applyThemeAndColors(root, pywal);
            } catch(e) {}

            // 2. Blur & Translucency
            const blur = localStorage.getItem('dashboard-blur') || '16';
            root.style.setProperty('--wp-blur', `${blur}px`);
            const transRaw = localStorage.getItem('dashboard-glass-translucency') || '60';
            const t = parseInt(transRaw, 10) / 100;
            root.style.setProperty('--ui-translucency', t);
            root.style.setProperty('--ui-blur', t <= 0 ? '0px' : '24px');
            root.style.setProperty('--ui-saturate', '180%');

            // 3. Media Loading
            const isVideo = localStorage.getItem('dashboard-wallpaper-is-video') === 'true';
            const wpUrl = localStorage.getItem('dashboard-wallpaper') || localStorage.getItem('login-wallpaper');
            
            if (isVideo && wpUrl) {
                // Videos are loaded via URL / stream
                if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', () => applyMediaToBackground(wpUrl, true));
                } else {
                    applyMediaToBackground(wpUrl, true);
                }
            } else {
                const cachedBlob = await getLocalWallpaper('active_wallpaper');
                if (cachedBlob) {
                    const blobUrl = URL.createObjectURL(cachedBlob);
                    if (document.readyState === 'loading') {
                        document.addEventListener('DOMContentLoaded', () => applyMediaToBackground(blobUrl, false));
                    } else {
                        applyMediaToBackground(blobUrl, false);
                    }
                } else if (wpUrl) {
                    if (document.readyState === 'loading') {
                        document.addEventListener('DOMContentLoaded', () => applyMediaToBackground(wpUrl, false));
                    } else {
                        applyMediaToBackground(wpUrl, false);
                    }
                    try {
                        const res = await fetch(wpUrl);
                        if (res.ok) {
                            const blob = await res.blob();
                            await saveLocalWallpaper(blob, 'active_wallpaper');
                        }
                    } catch(e) {}
                }
            }
        })();
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server</title>
    <style>
        ::selection { background: var(--primary); color: #0b0f14; text-shadow: none; }
        ::-moz-selection { background: var(--primary); color: #0b0f14; text-shadow: none; }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-family, 'Inter', -apple-system, system-ui, sans-serif);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .wallpaper {
            position: fixed;
            inset: 0;
            background: var(--login-wp-url, url('/bg.jpg')) no-repeat center center;
            background-size: cover;
            z-index: 0;
        }

        .wallpaper::after {
            content: '';
            position: absolute;
            inset: 0;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            background: rgba(0, 0, 0, 0.25);
        }

                .login-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 360px;
            padding: 40px;
            
            background: rgba(var(--glass-rgb), calc((1 - var(--ui-translucency)) * 0.5));
            backdrop-filter: blur(var(--ui-blur)) saturate(var(--ui-saturate));
            -webkit-backdrop-filter: blur(var(--ui-blur)) saturate(var(--ui-saturate));
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: var(--shadow-inner), var(--shadow-outer);
            color: white;
        }

        .card-logo { font-size: 2rem; margin-bottom: 0.5rem; }

        h2 {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            margin-bottom: 0.25rem;
            text-shadow: 0 1px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.5);
            margin-bottom: 2rem;
        }

        label {
            display: block;
            text-align: left;
            font-size: 0.78rem;
            font-weight: 500;
            color: rgba(255,255,255,0.6);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 0.4rem;
            margin-top: 1rem;
        }

        label:first-of-type { margin-top: 0; }

        select, input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: inherit;
            transition: border-color 0.2s, background 0.2s;
            -webkit-appearance: none;
            appearance: none;
        }

        select option { background: #1e293b; color: white; }

        .select-wrapper { position: relative; }
        .select-wrapper::after {
            content: '▾';
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.5);
            pointer-events: none;
        }

        select:focus, input:focus {
            outline: none;
            border-color: rgba(255,255,255,0.4);
            background: rgba(255,255,255,0.13);
        }

        input::placeholder { color: rgba(255,255,255,0.3); }

        .error {
            background: rgba(239,68,68,0.15);
            border: 1px solid rgba(239,68,68,0.35);
            color: #fca5a5;
            padding: 0.6rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
            display: none;
            text-align: left;
        }

        button {
            margin-top: 1.5rem;
            width: 100%;
            padding: 0.85rem;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.25);
            color: white;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 2px 12px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.15);
        }

        button:hover {
            background: rgba(255,255,255,0.22);
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.2);
        }

        button:active { transform: translateY(0); }
    
        .wallpaper-video {
            position: fixed;
            inset: -20px;
            width: calc(100vw + 40px);
            height: calc(100vh + 40px);
            object-fit: cover;
            filter: blur(var(--wp-blur, 16px));
            z-index: -2;
            transform: translateZ(0);
            pointer-events: none;
        }

    </style>
</head>
<body>
    <div class="wallpaper"><video class="wallpaper-video" autoplay loop muted playsinline style="display:none;"></video></div>
    <div class="login-card">
        <h2 id="login-brand">Server</h2>
        <p class="subtitle">Sign in to continue</p>
        <div class="error" id="error">Invalid username or password</div>
        <form id="login-form">
            <label for="username">Account</label>
            <div class="select-wrapper">
                <select id="username" required>
                    <option value="tin">tin</option>
                    <option value="peach">peach</option>
                </select>
            </div>
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="••••••••" required autofocus>
            <button type="submit">Sign In</button>
        </form>
    </div>
    <script>
        // Fetch dynamic server identity
        fetch('/api/app/config').then(r => r.json()).then(data => {
            if (data.display_name) {
                const b = document.getElementById('login-brand');
                if (b) b.textContent = data.display_name;
                document.title = `${data.display_name} - Login`;
            }
        }).catch(() => {});

        // Apply saved login settings from localStorage
        (function() {
            document.body.setAttribute('data-theme', localStorage.getItem('dashboard-theme') || 'glass');
            const root = document.documentElement;
            // Wallpaper
            const wp = localStorage.getItem('login-wallpaper');
            if (wp) root.style.setProperty('--login-wp-url', `url('${wp}')`);
            
            // Glass Translucency
            const transRaw = localStorage.getItem('dashboard-glass-translucency') || '60';
            const t = parseInt(transRaw, 10) / 100;
            root.style.setProperty('--ui-translucency', t);
            if (t <= 0) {
                root.style.setProperty('--ui-blur', '0px');
                root.style.setProperty('--ui-saturate', '100%');
            } else {
                root.style.setProperty('--ui-blur', '32px');
                root.style.setProperty('--ui-saturate', '180%');
            }
            
            // Color
            const colorMode = localStorage.getItem('dashboard-color-mode') || 'auto';
            let primaryColor = '';
            if (colorMode === 'manual') {
                primaryColor = localStorage.getItem('dashboard-manual-color');
            } else {
                const currentTheme = localStorage.getItem('dashboard-theme') || 'glass';
                if (currentTheme === 'solid') primaryColor = '#adc6ff';
                else if (currentTheme === 'ultra') primaryColor = '#7eb8f7';
                else primaryColor = localStorage.getItem('dashboard-auto-color');
            }
            if (primaryColor) root.style.setProperty('--primary', primaryColor);
            
            // Font
            const font = localStorage.getItem('dashboard-font');
            if (font && font !== 'Inter') {
                root.style.setProperty('--font-family', `"${font}", -apple-system, system-ui, sans-serif`);
                const link = document.createElement('link');
                link.rel = 'stylesheet';
                link.href = `https://fonts.googleapis.com/css2?family=${font.replace(/ /g, '+')}:wght@400;500;600;700&display=swap`;
                document.head.appendChild(link);
            }
        })();

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errEl = document.getElementById('error');
            errEl.style.display = 'none';
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            if (res.ok) {
                window.location.href = '/';
            } else {
                errEl.style.display = 'block';
            }
        });
    </script>
</body>
</html>
