    <polygon points="48,18 56,38 40,46 36,28" fill="url(#obs-p1)" />
    <polygon points="28,28 36,28 40,46 24,46" fill="url(#obs-p2)" />
    <polygon points="24,46 32,60 40,46" fill="url(#obs-p3)" />
    <polygon points="8,38 24,46 32,60" fill="url(#obs-p1)" opacity="0.9" />
    <polygon points="56,38 40,46 32,60" fill="url(#obs-p3)" opacity="0.9" />
  </g>
