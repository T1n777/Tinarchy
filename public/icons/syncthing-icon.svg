<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sync-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="sync-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>
  <g filter="url(#sync-glow)">
    <!-- Outer Ring -->
    <circle cx="32" cy="32" r="26" fill="none" stroke="url(#sync-grad)" stroke-width="4" />
    <!-- Connecting network paths -->
    <path d="M 32 18 L 44 38 L 20 38 Z" fill="none" stroke="#e0f2fe" stroke-width="2.5" stroke-linejoin="round" />
    <path d="M 32 32 L 32 18" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round" />
    <path d="M 32 32 L 44 38" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round" />
    <path d="M 32 32 L 20 38" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round" />
    <!-- Nodes -->
    <circle cx="32" cy="18" r="4.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="44" cy="38" r="4.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="20" cy="38" r="4.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="32" cy="32" r="3.5" fill="#ffffff" />
  </g>
</svg>
