<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Leaf Gradients -->
    <linearGradient id="leaf-grad-center" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="leaf-grad-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="leaf-grad-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    
    <!-- Body Gradient -->
    <radialGradient id="body-grad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </radialGradient>
    
    <!-- Facet Shadow Gradient -->
    <linearGradient id="cross-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B45309" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#78350F" stop-opacity="0.85" />
    </linearGradient>

    <!-- Subtle Drop Shadow Filter for Visibility on Light & Dark Tabs -->
    <filter id="tab-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <g filter="url(#tab-glow)">
    <!-- Crown Leaves -->
    <!-- Left Outer Leaf -->
    <path d="M 32 23 C 24 19 15 13 14 3 C 21 6 27 12 32 23 Z" fill="url(#leaf-grad-left)" />
    <!-- Right Outer Leaf -->
    <path d="M 32 23 C 40 19 49 13 50 3 C 43 6 37 12 32 23 Z" fill="url(#leaf-grad-right)" />
    <!-- Left Inner Leaf -->
    <path d="M 32 23 C 27 16 20 10 23 2 C 28 6 31 14 32 23 Z" fill="url(#leaf-grad-center)" />
    <!-- Right Inner Leaf -->
    <path d="M 32 23 C 37 16 44 10 41 2 C 36 6 33 14 32 23 Z" fill="url(#leaf-grad-center)" />
    <!-- Center Tall Leaf -->
    <path d="M 32 24 C 29 14 30 5 32 1 C 34 5 35 14 32 24 Z" fill="#6EE7B7" />

    <!-- Pineapple Body Base -->
    <ellipse cx="32" cy="42" rx="18" ry="20" fill="url(#body-grad)" />

    <!-- Diamond Texture / Scale Pattern Clipped to Body -->
    <g clip-path="url(#body-clip)">
      <clipPath id="body-clip">
        <ellipse cx="32" cy="42" rx="17.5" ry="19.5" />
      </clipPath>
      
      <!-- Diagonal Lattice Lines -->
      <path d="M 14 34 L 46 58 M 16 26 L 50 50 M 26 22 L 52 40 M 14 50 L 38 62" stroke="url(#cross-grad)" stroke-width="1.6" stroke-linecap="round" />
      <path d="M 50 34 L 18 58 M 48 26 L 14 50 M 38 22 L 12 40 M 50 50 L 26 62" stroke="url(#cross-grad)" stroke-width="1.6" stroke-linecap="round" />

      <!-- Diamond Center Pip Accents -->
      <circle cx="32" cy="42" r="1.4" fill="#FEF08A" />
      <circle cx="23" cy="35" r="1.2" fill="#FEF08A" />
      <circle cx="41" cy="35" r="1.2" fill="#FEF08A" />
      <circle cx="23" cy="49" r="1.2" fill="#FEF08A" />
      <circle cx="41" cy="49" r="1.2" fill="#FEF08A" />
      <circle cx="32" cy="30" r="1.2" fill="#FEF08A" />
      <circle cx="32" cy="54" r="1.2" fill="#FEF08A" />
    </g>

    <!-- Glossy Highlight Accent -->
    <path d="M 20 32 C 17 38 17 46 20 52 C 18 46 18 38 21 33 C 21.5 32 20.5 31.5 20 32 Z" fill="#FFFFFF" opacity="0.35" />
  </g>
</svg>