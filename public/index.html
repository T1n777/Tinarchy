<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/manifest.json">
    <title>Tinarchy Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --bg: #0a0f1e;
            --glass: rgba(14, 19, 34, 0.4);
            --glass-hover: rgba(14, 19, 34, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-border-hover: rgba(255, 255, 255, 0.2);
            --text: #dee1f7;
            --text-muted: #8c909f;
            --primary: #adc6ff;
            --primary-solid: #4d8eff;
            --online: #4edea3;
            --offline: #ffb4ab;
            --tor-purple: #ddb7ff;
            --tor-bg: rgba(111, 0, 190, 0.1);
            --tor-border: rgba(214, 169, 255, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Wallpaper background */
        .wallpaper {
            position: fixed;
            inset: 0;
            background: url('/dashboard-bg.jpg') no-repeat center center;
            background-size: cover;
            z-index: -2;
        }
        .wallpaper::after {
            content: '';
            position: absolute;
            inset: 0;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            background: rgba(0, 0, 0, 0.45);
        }

        /* Ambient Background Orbs */
        .ambient-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            opacity: 0.4;
            pointer-events: none;
            animation: float 20s infinite alternate ease-in-out;
        }
        .orb-teal {
            background: radial-gradient(circle, #4edea3 0%, transparent 70%);
            width: 500px; height: 500px;
            top: -15%; left: -10%;
        }
        .orb-purple {
            background: radial-gradient(circle, #6f00be 0%, transparent 70%);
            width: 700px; height: 700px;
            bottom: -25%; right: -15%;
        }
        .orb-blue {
            background: radial-gradient(circle, #005ac2 0%, transparent 70%);
            width: 400px; height: 400px;
            top: 40%; left: 35%;
        }
        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, 50px) scale(1.1); }
            100% { transform: translate(-20px, 20px) scale(0.9); }
        }

        /* Glass Utilities */
        .glass {
            background: var(--glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: inset 0 1px 0 0 rgba(255,255,255,0.08), 0 8px 32px rgba(0,0,0,0.25);
        }
        .glass:hover {
            background: var(--glass-hover);
            border-color: var(--glass-border-hover);
        }

        /* Layout */
        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 80px 24px 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
            animation: slideUp 0.5s ease-out both;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin: 0 0 0.5rem 0;
            background: linear-gradient(135deg, var(--primary), #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-muted);
            font-size: 1rem;
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        /* Stats Row */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin: 24px 0;
        }
        .stat-card {
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s;
        }
        .stat-card .stat-label {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 8px;
        }
        .stat-card .stat-value {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--primary);
            margin-bottom: 10px;
        }
        .progress-bar {
            width: 100%;
            height: 3px;
            background: rgba(255,255,255,0.08);
            border-radius: 999px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            border-radius: 999px;
            background: var(--primary);
            box-shadow: 0 0 8px rgba(173,198,255,0.5);
            transition: width 0.8s ease-out;
        }

        /* Tor Banner */
        .tor-exit-banner {
            background: var(--tor-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--tor-border);
            box-shadow: inset 0 1px 0 0 rgba(214,169,255,0.15);
            border-radius: 12px;
            padding: 20px 24px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }
        .tor-exit-banner:hover {
            box-shadow: 0 8px 32px rgba(111,0,190,0.15), inset 0 1px 0 0 rgba(214,169,255,0.15);
        }
        .tor-exit-banner.active {
            border-color: rgba(214,169,255,0.5);
            box-shadow: 0 0 20px rgba(111,0,190,0.2), inset 0 1px 0 0 rgba(214,169,255,0.15);
        }
        .tor-exit-info { display: flex; align-items: center; gap: 16px; }
        .tor-icon {
            width: 48px; height: 48px;
            border-radius: 50%;
            background: rgba(111,0,190,0.15);
            border: 1px solid var(--tor-border);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; flex-shrink: 0;
        }
        .tor-exit-info h2 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--tor-purple);
            margin-bottom: 2px;
        }
        .tor-exit-info p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Services Grid */
        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text);
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }
        @media (min-width: 640px) { .grid { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 1024px) { .grid { grid-template-columns: repeat(3, 1fr); } }

        .card {
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            transition: all 0.3s;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .service-icon {
            width: 48px; height: 48px;
            border-radius: 12px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .status-badge::before {
            content: '';
            width: 7px; height: 7px;
            border-radius: 50%;
        }
        .status-badge.online {
            color: var(--online);
            background: rgba(78,222,163,0.08);
        }
        .status-badge.online::before {
            background: var(--online);
            box-shadow: 0 0 8px rgba(78,222,163,0.8);
        }
        .status-badge.offline {
            color: var(--offline);
            background: rgba(255,180,171,0.08);
            border-color: rgba(255,180,171,0.15);
        }
        .status-badge.offline::before {
            background: var(--offline);
            box-shadow: 0 0 6px rgba(255,180,171,0.5);
        }

        .service-details {
            margin-top: 12px;
        }
        .service-details h2 {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 2px;
        }
        .service-details p {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-bottom: 2px;
        }
        .service-details .systemd-name {
            font-family: monospace;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.2);
        }

        a.service-link {
            color: inherit;
            text-decoration: none;
            transition: color 0.2s;
        }
        a.service-link:hover { color: var(--primary); }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            padding-top: 16px;
            border-top: 1px solid rgba(255,255,255,0.06);
        }

        .port {
            font-family: monospace;
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .actions { display: flex; gap: 8px; }

        .btn {
            appearance: none;
            border: none;
            border-radius: 8px;
            padding: 7px 16px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(8px);
        }
        .btn:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.2);
        }
        .btn.start { color: var(--online); }
        .btn.start:hover { border-color: rgba(78,222,163,0.4); background: rgba(78,222,163,0.08); }
        .btn.stop { color: var(--offline); }
        .btn.stop:hover { border-color: rgba(255,180,171,0.4); background: rgba(255,180,171,0.08); }

        .btn.tor-toggle {
            color: var(--text-muted);
        }
        .btn.tor-toggle.active {
            background: rgba(111,0,190,0.3);
            border-color: var(--tor-border);
            color: var(--tor-purple);
        }
        .btn.tor-toggle.active:hover { filter: brightness(1.2); }
        .btn:disabled { opacity: 0.4; cursor: wait; }

        /* Toast */
        .toast-container {
            position: fixed;
            bottom: 24px; right: 24px;
            display: flex; flex-direction: column; gap: 8px;
            z-index: 100;
        }
        .toast {
            background: var(--glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
            font-size: 0.85rem; font-weight: 500;
            animation: slideInRight 0.3s ease-out;
        }
        .toast.success { border-color: rgba(78,222,163,0.4); }
        .toast.error { border-color: rgba(255,180,171,0.4); }
        .toast.fade-out { animation: fadeOutRight 0.3s ease-in forwards; }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(100%); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes fadeOutRight {
            from { opacity: 1; transform: translateX(0); }
            to { opacity: 0; transform: translateX(100%); }
        }

        /* Responsive */
        @media (max-width: 640px) {
            .stats-bar { grid-template-columns: 1fr; }
            .top-nav .meta { display: none; }
            .tor-exit-banner { flex-direction: column; align-items: flex-start; gap: 12px; }
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }
    </style>
</head>
<body>
    <!-- Wallpaper -->
    <div class="wallpaper"></div>

    <!-- Ambient Background -->

    <div class="container">
        <div class="header" style="position: relative;">
            <button onclick="logout()" style="position: absolute; right: 0; top: 0; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-size: 0.9rem;">Logout</button>
            <h1 id="sys-hostname">Server <span style="font-size: 1rem; opacity: 0.5;">...</span></h1>
            <p>
                <span id="sys-tailscale">IP: ...</span> • 
                <span id="sys-uptime">Up: ...</span>
            </p>
        </div>
        <!-- Stats Bar -->
        <div class="stats-bar" id="stats-bar">
            <div class="stat-card glass">
                <div class="stat-label">RAM</div>
                <div class="stat-value" id="ram-text">...</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="ram-bar" style="width: 0%"></div>
                </div>
            </div>
            <div class="stat-card glass">
                <div class="stat-label">Disk</div>
                <div class="stat-value" id="disk-text">...</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="disk-bar" style="width: 0%"></div>
                </div>
            </div>
            <div class="stat-card glass">
                <div class="stat-label">CPU</div>
                <div class="stat-value" id="cpu-text">...</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="cpu-bar" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <!-- Tor Exit Banner -->
        <div class="tor-exit-banner" id="tor-exit-banner">
            <div class="tor-exit-info">
                <div class="tor-icon">🧅</div>
                <div>
                    <h2>Global Tor Exit Node</h2>
                    <p>Route all Tailscale client traffic through the Tor network.</p>
                </div>
            </div>
            <button class="btn tor-toggle" id="tor-exit-btn" onclick="toggleTorExit()">
                Checking...
            </button>
        </div>

        <!-- Services -->
        <div class="grid" id="services-container"></div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script>
        const container = document.getElementById('services-container');
        const toastContainer = document.getElementById('toast-container');

        function showToast(message, type = 'default') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = message;
            toastContainer.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('fade-out');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        async function fetchSystemStats() {
            try {
                const res = await fetch('/api/system');
                if(res.status === 401) { window.location.href = "/login.html"; return; }
                if(!res.ok) return;
                const stats = await res.json();

                document.getElementById('sys-hostname').textContent = stats.hostname;
                document.getElementById('sys-tailscale').textContent = `IP: ${stats.tailscale_ip}`;
                document.getElementById('sys-uptime').textContent = `Up: ${stats.uptime}`;

                document.getElementById('ram-text').textContent = `${stats.ram_used_mb}MB / ${stats.ram_total_mb}MB`;
                const ramBar = document.getElementById('ram-bar');
                ramBar.style.width = `${stats.ram_percent}%`;
                ramBar.style.backgroundColor = stats.ram_percent > 85 ? '#ffb4ab' : (stats.ram_percent > 70 ? '#fcc419' : '');

                document.getElementById('disk-text').textContent = `${stats.disk_used} / ${stats.disk_total}`;
                const diskBar = document.getElementById('disk-bar');
                diskBar.style.width = `${stats.disk_percent}%`;
                diskBar.style.backgroundColor = stats.disk_percent > 90 ? '#ffb4ab' : '';

                document.getElementById('cpu-text').textContent = `${stats.cpu_percent}% (${stats.loadavg[0]})`;
                const cpuBar = document.getElementById('cpu-bar');
                cpuBar.style.width = `${stats.cpu_percent}%`;
                cpuBar.style.backgroundColor = stats.cpu_percent > 80 ? '#ffb4ab' : '';
            } catch (err) {
                console.error("Failed to load system stats", err);
            }
        }

        async function fetchServices() {
            try {
                const res = await fetch('/api/services');
                if(res.status === 401) { window.location.href = "/login.html"; return; }
                if(!res.ok) return;
                const data = await res.json();
                renderServices(data);
            } catch (err) {
                console.error("Failed to load services", err);
            }
        }

        function renderServices(services) {
            container.innerHTML = '';
            services.forEach(s => {
                const isOnline = s.status === 'online';
                const isSuwayomi = s.id === 'suwayomi';
                const isTorEnabled = isSuwayomi ? s.torProxyEnabled : false;

                const card = document.createElement('div');
                card.className = 'card glass';

                let torButtonHTML = '';
                if (isSuwayomi && isOnline) {
                    torButtonHTML = `
                        <button
                            class="btn tor-toggle ${isTorEnabled ? 'active' : ''}"
                            onclick="toggleTorProxy(${!isTorEnabled}, this)"
                        >
                            Tor: ${isTorEnabled ? 'ON' : 'OFF'}
                        </button>
                    `;
                }

                const titleHTML = (isOnline && s.port > 0)
                    ? `<a href="http://${window.location.hostname}:${s.port}" target="_blank" class="service-link"><h2>${s.name}</h2></a>`
                    : `<h2>${s.name}</h2>`;

                card.innerHTML = `
                    <div class="card-header">
                        <div class="service-icon">${s.icon || '⚙️'}</div>
                        <div class="status-badge ${s.status}">${s.status}</div>
                    </div>
                    <div class="service-details">
                        ${titleHTML}
                        <p>${s.description}</p>
                        <div class="systemd-name">${s.systemd}.service</div>
                    </div>
                    <div class="card-footer">
                        <div class="port">${s.port > 0 ? `Port ${s.port}` : ''}</div>
                        ${userRole === 'admin' ? `
                        <div class="actions">
                            ${torButtonHTML}
                            <button
                                class="btn ${isOnline ? 'stop' : 'start'}"
                                onclick="toggleService('${s.id}', '${isOnline ? 'stop' : 'start'}', this, '${s.name}')"
                            >
                                ${isOnline ? 'Stop' : 'Start'}
                            </button>
                        </div>
                        ` : ''}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function logout() {
            try {
                await fetch('/api/logout');
                window.location.href = '/login.html';
            } catch(e) {
                window.location.href = '/login.html';
            }
        }

        async function toggleService(id, action, btnElement, serviceName) {
            btnElement.disabled = true;
            const originalText = btnElement.innerText;
            btnElement.innerText = '...';

            try {
                const res = await fetch(`/api/services/${id}/toggle`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action })
                });

                if (res.status === 401) { window.location.href = "/login.html"; return; }
                if (!res.ok) throw new Error(await res.text());

                showToast(`Successfully sent ${action} command to ${serviceName}`, 'success');
                setTimeout(fetchServices, 1000);
            } catch (err) {
                showToast(`Failed to ${action} ${serviceName}`, 'error');
                btnElement.innerText = originalText;
                btnElement.disabled = false;
            }
        }

        async function toggleTorProxy(enable, btnElement) {
            btnElement.disabled = true;
            btnElement.innerText = '...';

            try {
                const res = await fetch('/api/suwayomi/tor', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ enable })
                });

                if (res.status === 401) { window.location.href = "/login.html"; return; }
                if (!res.ok) throw new Error(await res.text());

                showToast(`Tor proxy ${enable ? 'enabled' : 'disabled'} for Suwayomi`, 'success');
                setTimeout(fetchServices, 2000);
            } catch (err) {
                showToast('Failed to toggle Tor proxy', 'error');
                btnElement.disabled = false;
            }
        }

        let torExitActive = false;
        let userRole = "guest";

        async function fetchTorExitStatus() {
            try {
                const res = await fetch('/api/system/tor-exit');
                if(res.status === 401) { window.location.href = "/login.html"; return; }
                if(!res.ok) return;
                const data = await res.json();
                torExitActive = data.active;

                const btn = document.getElementById('tor-exit-btn');
                const banner = document.getElementById('tor-exit-banner');

                if (torExitActive) {
                    btn.classList.add('active');
                    btn.innerText = 'Enabled';
                    banner.classList.add('active');
                } else {
                    btn.classList.remove('active');
                    btn.innerText = 'Disabled';
                    banner.classList.remove('active');
                }
                btn.disabled = false;
            } catch (err) {
                console.error("Failed to load Tor Exit status", err);
            }
        }

        async function toggleTorExit() {
            const btn = document.getElementById('tor-exit-btn');
            btn.disabled = true;
            btn.innerText = '...';

            const newState = !torExitActive;

            try {
                const res = await fetch('/api/system/tor-exit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ enable: newState })
                });

                if (res.status === 401) { window.location.href = "/login.html"; return; }
                if (!res.ok) throw new Error(await res.text());

                showToast('Tor Exit Node status changed', 'success');
                setTimeout(fetchTorExitStatus, 1000);
            } catch (err) {
                showToast('Failed to toggle Tor Exit Node', 'error');
                btn.disabled = false;
            }
        }

        async function fetchUserRole() {
            try {
                const res = await fetch('/api/me');
                if (res.status === 401) { window.location.href = "/login.html"; return; }
                if (res.ok) {
                    const data = await res.json();
                    userRole = data.role;
                    if (userRole !== 'admin') {
                        document.getElementById('tor-exit-banner').style.display = 'none';
                        document.getElementById('stats-bar').style.display = 'none';
                    }
                }
            } catch (e) {
                console.error('Auth check failed:', e);
            }
        }

        async function initDashboard() {
            await fetchUserRole();
            fetchSystemStats();
            fetchServices();
            fetchTorExitStatus();

            setInterval(() => {
                fetchSystemStats();
                fetchServices();
                fetchTorExitStatus();
            }, 5000);
        }

        initDashboard();
    </script>
</body>
</html>
