<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/manifest.json">
    <title>Tinarchy Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --bg: #0a0f1e;
            --glass: rgba(14, 19, 34, 0.4);
            --glass-hover: rgba(14, 19, 34, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-border-hover: rgba(255, 255, 255, 0.2);
            --text: #dee1f7;
            --text-muted: #8c909f;
            --primary: #ffffff; /* White */
            --primary-solid: #ffffff;
            --online: #4edea3;
            --offline: #ffb4ab;
            --tor-purple: #ddb7ff;
            --tor-bg: rgba(111, 0, 190, 0.1);
            --tor-border: rgba(214, 169, 255, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Wallpaper background */
        .wallpaper {
            position: fixed;
            inset: -20px;
            background: var(--wp-url, url('/dashboard-bg.jpg')) no-repeat center center;
            background-size: cover;
            filter: blur(var(--wp-blur, 6px));
            z-index: -2;
            transform: translateZ(0);
        }
        .wallpaper-tint {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: -1;
            pointer-events: none;
        }

        /* Glass Utilities */
        .glass {
            background: var(--glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: inset 0 1px 0 0 rgba(255,255,255,0.08), 0 8px 32px rgba(0,0,0,0.25);
            will-change: transform;
        }
        .glass:hover {
            background: var(--glass-hover);
            border-color: var(--glass-border-hover);
        }

        /* Layout */
        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px 40px;
        }

        /* Top Nav Pill */
        .top-nav-wrapper {
            position: sticky;
            top: 16px;
            z-index: 50;
            display: flex;
            justify-content: center;
            margin: 16px -24px 24px;
            pointer-events: none;
        }
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: rgba(14, 19, 34, 0.55);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.13);
            border-radius: 999px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.1);
            gap: 16px;
            pointer-events: all;
        }
        .top-nav .brand {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.03em;
        }
        .top-nav .meta {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .meta-badge {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-muted);
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 4px 12px;
            border-radius: 999px;
        }
        .logout-btn {
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--primary);
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px 16px;
            border-radius: 8px;
            transition: background 0.2s;
        }
        .logout-btn:hover {
            background: rgba(255,255,255,0.08);
        }

        /* Stats Row */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin: 24px 0;
        }
        .stat-card {
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s;
        }
        .stat-card .stat-label {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 8px;
        }
        .stat-card .stat-value {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--primary);
            margin-bottom: 10px;
        }
        .progress-bar {
            width: 100%;
            height: 3px;
            background: rgba(255,255,255,0.08);
            border-radius: 999px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            border-radius: 999px;
            background: var(--primary);
            box-shadow: 0 0 8px var(--primary);
            transition: width 0.8s ease-out;
        }

        /* Tor Banner */
        .tor-exit-banner {
            background: var(--glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--tor-border);
            box-shadow: inset 0 1px 0 0 rgba(255,255,255,0.08), 0 8px 32px rgba(0,0,0,0.25);
            border-radius: 12px;
            padding: 20px 24px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
            will-change: transform;
        }
        .tor-exit-banner:hover {
            background: var(--glass-hover);
        }
        .tor-exit-banner.active {
            border-color: rgba(214,169,255,0.8);
            box-shadow: 0 0 16px rgba(214,169,255,0.2), inset 0 1px 0 0 rgba(255,255,255,0.08);
        }
        .tor-exit-info { display: flex; align-items: center; gap: 16px; }
        .tor-icon {
            width: 48px; height: 48px;
            border-radius: 50%;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--tor-border);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; flex-shrink: 0;
        }
        .tor-exit-info h2 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--tor-purple);
            margin-bottom: 2px;
        }
        .tor-exit-info p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Services Grid */
        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text);
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }
        @media (min-width: 640px) { .grid { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 1024px) { .grid { grid-template-columns: repeat(3, 1fr); } }

        .card {
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            transition: all 0.3s;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .service-icon {
            width: 48px; height: 48px;
            border-radius: 12px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .status-badge::before {
            content: '';
            width: 7px; height: 7px;
            border-radius: 50%;
        }
        .status-badge.online {
            color: var(--online);
            background: rgba(78,222,163,0.08);
        }
        .status-badge.online::before {
            background: var(--online);
            box-shadow: 0 0 8px rgba(78,222,163,0.8);
        }
        .status-badge.offline {
            color: var(--offline);
            background: rgba(255,180,171,0.08);
            border-color: rgba(255,180,171,0.15);
        }
        .status-badge.offline::before {
            background: var(--offline);
            box-shadow: 0 0 6px rgba(255,180,171,0.5);
        }

        .service-details {
            margin-top: 12px;
        }
        .service-details h2 {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 2px;
        }
        .service-details p {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-bottom: 2px;
        }
        .service-details .systemd-name {
            font-family: monospace;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.2);
        }

        a.service-link {
            color: inherit;
            text-decoration: none;
            transition: color 0.2s;
        }
        a.service-link:hover { color: var(--primary); }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            padding-top: 16px;
            border-top: 1px solid rgba(255,255,255,0.06);
        }

        .port {
            font-family: monospace;
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .actions { display: flex; gap: 8px; }

        .btn {
            appearance: none;
            border: none;
            border-radius: 8px;
            padding: 7px 16px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(8px);
        }
        .btn:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.2);
        }

        /* Toggle Switch */
        .toggle-switch {
            position: relative;
            appearance: none;
            outline: none;
            width: 44px;
            height: 24px;
            background: rgba(255,180,171,0.08);
            border: 1px solid rgba(255,180,171,0.4);
            border-radius: 24px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.2);
            flex-shrink: 0;
        }
        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 18px;
            height: 18px;
            background-color: var(--offline);
            border-radius: 50%;
            transition: transform 0.3s cubic-bezier(0.4, 0.0, 0.2, 1), background-color 0.3s;
            box-shadow: 0 0 8px rgba(255,180,171,0.5);
        }
        .toggle-switch.on {
            background: rgba(78,222,163,0.08);
            border-color: rgba(78,222,163,0.4);
        }
        .toggle-switch.on::after {
            background-color: var(--online);
            transform: translateX(20px);
            box-shadow: 0 0 8px rgba(78,222,163,0.8);
        }
        .toggle-switch:disabled {
            opacity: 0.5;
            cursor: wait;
        }

        /* Toast */
        .toast-container {
            position: fixed;
            bottom: 24px; right: 24px;
            display: flex; flex-direction: column; gap: 8px;
            z-index: 100;
        }
        .toast {
            background: var(--glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
            font-size: 0.85rem; font-weight: 500;
            animation: slideInRight 0.3s ease-out;
        }
        .toast.success { border-color: rgba(78,222,163,0.4); }
        .toast.error { border-color: rgba(255,180,171,0.4); }
        .toast.fade-out { animation: fadeOutRight 0.3s ease-in forwards; }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(100%); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes fadeOutRight {
            from { opacity: 1; transform: translateX(0); }
            to { opacity: 0; transform: translateX(100%); }
        }

        /* Settings Modal */
        .settings-overlay {
            position: fixed; inset: 0; z-index: 100;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center;
        }
        .settings-card {
            width: 90%; max-width: 400px;
            padding: 24px; border-radius: 16px;
        }
        .theme-select {
            width: 100%; padding: 10px 12px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: white; border-radius: 8px; margin-top: 8px;
            font-family: inherit; font-size: 0.9rem;
        }
        .theme-select option { background: #0a0f1e; }
        .setting-group label { font-size: 0.9rem; font-weight: 500; color: var(--text); }

        /* Solid Dark Theme Override */
        body[data-theme="solid"] {
            --bg: #0b0d13;
            --glass: #141722;
            --glass-hover: #1b1e2a;
            --glass-border: rgba(255,255,255,0.02);
            --tor-bg: #1a1525;
            --primary: #adc6ff;
            --primary-solid: #4d8eff;
            background-color: var(--bg);
        }
        body[data-theme="solid"] .wallpaper,
        body[data-theme="solid"] .wallpaper-tint {
            display: none;
        }
        body[data-theme="solid"] .glass,
        body[data-theme="solid"] .top-nav,
        body[data-theme="solid"] .tor-exit-banner,
        body[data-theme="solid"] .toast {
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            box-shadow: none !important;
        }
        body[data-theme="solid"] .ambient-orb { display: none; }

        /* ─── Ultra Performance Mode ─── */
        /* Goal: zero GPU strain — no blur, no shadows, no transitions,
           no web fonts, no wallpaper, minimal repaints. Looks clean but barebones. */
        body[data-theme="ultra"] {
            --bg: #0d0d0d;
            --glass: #181818;
            --glass-hover: #202020;
            --glass-border: #2a2a2a;
            --glass-border-hover: #333;
            --text: #e0e0e0;
            --text-muted: #888;
            --primary: #7eb8f7;
            --primary-solid: #4a90d9;
            --online: #5cba82;
            --offline: #d9706a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif !important;
            background-color: var(--bg) !important;
        }
        /* Kill wallpaper & tint entirely */
        body[data-theme="ultra"] .wallpaper,
        body[data-theme="ultra"] .wallpaper-tint { display: none !important; }

        /* Kill all backdrop-filter, box-shadow, transition, animation */
        body[data-theme="ultra"] *,
        body[data-theme="ultra"] *::before,
        body[data-theme="ultra"] *::after {
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            box-shadow: none !important;
            transition: none !important;
            animation: none !important;
            text-shadow: none !important;
        }

        /* Flat solid surfaces */
        body[data-theme="ultra"] .glass,
        body[data-theme="ultra"] .top-nav,
        body[data-theme="ultra"] .tor-exit-banner,
        body[data-theme="ultra"] .toast {
            background: var(--glass) !important;
            border: 1px solid var(--glass-border) !important;
            border-radius: 10px !important;
        }

        /* Flat nav bar */
        body[data-theme="ultra"] .top-nav {
            border-radius: 8px !important;
            background: #1c1c1c !important;
        }

        /* Remove glow from status dots and progress bar */
        body[data-theme="ultra"] .status-badge.online::before,
        body[data-theme="ultra"] .status-badge.offline::before,
        body[data-theme="ultra"] .toggle-switch::after,
        body[data-theme="ultra"] .progress-fill { box-shadow: none !important; }

        /* Flat toggle switch */
        body[data-theme="ultra"] .toggle-switch {
            background: #2a2a2a !important;
            border-color: #444 !important;
        }
        body[data-theme="ultra"] .toggle-switch.on {
            background: #1e3a2a !important;
            border-color: #3a7a56 !important;
        }
        body[data-theme="ultra"] .toggle-switch::after { background-color: #888 !important; }
        body[data-theme="ultra"] .toggle-switch.on::after { background-color: var(--online) !important; }

        /* Flat buttons */
        body[data-theme="ultra"] .btn {
            background: #252525 !important;
            border: 1px solid #333 !important;
        }

        /* Flat progress bar */
        body[data-theme="ultra"] .progress-fill {
            background: var(--primary) !important;
        }

        /* Flat toast */
        body[data-theme="ultra"] .toast {
            background: #1c1c1c !important;
        }

        /* Responsive */
        @media (max-width: 640px) {
            /* Reduce blur and shadow on mobile to ease GPU load */
            .glass, .tor-exit-banner, .toast {
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
                box-shadow: inset 0 1px 0 0 rgba(255,255,255,0.08), 0 4px 16px rgba(0,0,0,0.2);
            }
            .top-nav {
                backdrop-filter: blur(16px);
                -webkit-backdrop-filter: blur(16px);
            }
            /* Remove expensive blur from tiny buttons on mobile */
            .btn {
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
                background: rgba(255,255,255,0.08);
            }
            .stats-bar { grid-template-columns: 1fr; }
            .top-nav .meta { display: none; }
            .tor-exit-banner { flex-direction: column; align-items: flex-start; gap: 12px; }
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }
    </style>
</head>
<body>
    <!-- Wallpaper -->
    <div class="wallpaper"></div>
    <div class="wallpaper-tint"></div>

    <div class="container">
        <!-- Top Navigation Pill -->
        <div class="top-nav-wrapper">
            <nav class="top-nav">
                <div class="brand" id="sys-hostname">tinarchy</div>
                <div class="meta">
                    <span class="meta-badge" id="sys-tailscale">IP: ...</span>
                    <span class="meta-badge" id="sys-uptime">Up: ...</span>
                </div>
                <div style="display: flex; gap: 8px;">
                    <button class="logout-btn" onclick="window.location.href='/settings.html'">Settings</button>
                    <button class="logout-btn" onclick="logout()">Logout</button>
                </div>
            </nav>
        </div>

        <!-- Stats Bar -->
        <div class="stats-bar" id="stats-bar">
            <div class="stat-card glass">
                <div class="stat-label">RAM</div>
                <div class="stat-value" id="ram-text">...</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="ram-bar" style="width: 0%"></div>
                </div>
            </div>
            <div class="stat-card glass">
                <div class="stat-label">Disk</div>
                <div class="stat-value" id="disk-text">...</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="disk-bar" style="width: 0%"></div>
                </div>
            </div>
            <div class="stat-card glass">
                <div class="stat-label">CPU</div>
                <div class="stat-value" id="cpu-text">...</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="cpu-bar" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <!-- Tor Exit Banner -->
        <div class="tor-exit-banner" id="tor-exit-banner">
            <div class="tor-exit-info">
                <div class="tor-icon">🧅</div>
                <div>
                    <h2 style="display: flex; align-items: center; gap: 8px;">Global Tor Exit Node <span id="tor-exit-label" style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em;"></span></h2>
                    <p>Route all Tailscale client traffic through the Tor network.</p>
                </div>
            </div>
            <button class="toggle-switch" aria-label="Toggle Tor Exit Node" id="tor-exit-btn" onclick="toggleTorExit()">
            </button>
        </div>

        <!-- Services -->
        <div class="grid" id="services-container"></div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <div class="settings-overlay" id="settings-modal" style="display: none;">
        <div class="settings-card glass">
            <h2 class="section-title" style="margin-bottom: 16px;">Device Settings</h2>
            <div class="setting-group">
                <label>Theme</label>
                <select id="theme-select" class="theme-select" onchange="setTheme(this.value)">
                    <option value="glass">Liquid Glass (Aesthetic)</option>
                    <option value="solid">Solid Dark (Performance)</option>
                    <option value="ultra">Ultra Performance (Barebones)</option>
                </select>
                <p style="font-size: 0.75rem; color: var(--text-muted); margin-top: 6px;">Saved locally to this device.</p>
            </div>
            <div style="text-align: right; margin-top: 24px;">
                <button class="btn" onclick="document.getElementById('settings-modal').style.display='none'" style="color: white;">Close</button>
            </div>
        </div>
    </div>

    <script>
        // Theme Initialization
        const savedTheme = localStorage.getItem('dashboard-theme') || 'glass';
        document.body.setAttribute('data-theme', savedTheme);
        document.getElementById('theme-select') && (document.getElementById('theme-select').value = savedTheme);

        // Wallpaper + blur from localStorage
        (function applyWallpaperSettings() {
            const wp = localStorage.getItem('dashboard-wallpaper');
            const blur = localStorage.getItem('dashboard-blur') || '6';
            const root = document.documentElement;
            if (wp) root.style.setProperty('--wp-url', `url('${wp}')`);
            root.style.setProperty('--wp-blur', `${blur}px`);
        })();

        // In ultra mode, block Google Fonts from loading by removing the link tag
        if (savedTheme === 'ultra') {
            const fontLink = document.querySelector('link[href*="fonts.googleapis"]');
            if (fontLink) fontLink.remove();
        }

        function setTheme(themeName) {
            document.body.setAttribute('data-theme', themeName);
            localStorage.setItem('dashboard-theme', themeName);
            // Reload to apply/remove font link cleanly
            window.location.reload();
        }

        const container = document.getElementById('services-container');
        const toastContainer = document.getElementById('toast-container');

        function showToast(message, type = 'default') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = message;
            toastContainer.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('fade-out');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        async function fetchSystemStats() {
            try {
                const res = await fetch('/api/system');
                if(res.status === 401) { window.location.href = "/login.html"; return; }
                if(!res.ok) return;
                const stats = await res.json();

                document.getElementById('sys-hostname').textContent = stats.hostname;
                document.getElementById('sys-tailscale').textContent = `IP: ${stats.tailscale_ip}`;
                document.getElementById('sys-uptime').textContent = `Up: ${stats.uptime}`;

                document.getElementById('ram-text').textContent = `${stats.ram_used_mb}MB / ${stats.ram_total_mb}MB`;
                const ramBar = document.getElementById('ram-bar');
                ramBar.style.width = `${stats.ram_percent}%`;
                ramBar.style.backgroundColor = stats.ram_percent > 85 ? '#ffb4ab' : (stats.ram_percent > 70 ? '#fcc419' : '');

                document.getElementById('disk-text').textContent = `${stats.disk_used} / ${stats.disk_total}`;
                const diskBar = document.getElementById('disk-bar');
                diskBar.style.width = `${stats.disk_percent}%`;
                diskBar.style.backgroundColor = stats.disk_percent > 90 ? '#ffb4ab' : '';

                document.getElementById('cpu-text').textContent = `${stats.cpu_percent}% (${stats.loadavg[0]})`;
                const cpuBar = document.getElementById('cpu-bar');
                cpuBar.style.width = `${stats.cpu_percent}%`;
                cpuBar.style.backgroundColor = stats.cpu_percent > 80 ? '#ffb4ab' : '';
            } catch (err) {
                console.error("Failed to load system stats", err);
            }
        }

        async function fetchServices() {
            try {
                const res = await fetch('/api/services');
                if(res.status === 401) { window.location.href = "/login.html"; return; }
                if(!res.ok) return;
                const data = await res.json();
                renderServices(data);
            } catch (err) {
                console.error("Failed to load services", err);
            }
        }

        function renderServices(services) {
            container.innerHTML = '';
            services.forEach(s => {
                const isOnline = s.status === 'online';
                const isSuwayomi = s.id === 'suwayomi';
                const isTorEnabled = isSuwayomi ? s.torProxyEnabled : false;

                const card = document.createElement('div');
                card.className = 'card glass';

                let torButtonHTML = '';
                if (isSuwayomi && isOnline) {
                    torButtonHTML = `
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <span style="font-size: 0.7rem; font-weight: 600; text-transform: uppercase; color: var(--text-muted)">Tor Proxy</span>
                            <button
                                class="toggle-switch ${isTorEnabled ? 'on' : ''}"
                                aria-label="Toggle Tor Proxy"
                                onclick="toggleTorProxy(${!isTorEnabled}, this)"
                            ></button>
                        </div>
                    `;
                }

                const titleHTML = (isOnline && s.port > 0)
                    ? `<a href="http://${window.location.hostname}:${s.port}" target="_blank" class="service-link"><h2>${s.name}</h2></a>`
                    : `<h2>${s.name}</h2>`;

                card.innerHTML = `
                    <div class="card-header">
                        <div class="service-icon">${s.icon || '⚙️'}</div>
                        <div class="status-badge ${s.status}">${s.status}</div>
                    </div>
                    <div class="service-details">
                        ${titleHTML}
                        <p>${s.description}</p>
                        <div class="systemd-name">${s.systemd}.service</div>
                    </div>
                    <div class="card-footer">
                        <div class="port">${s.port > 0 ? `Port ${s.port}` : ''}</div>
                        <div class="actions">
                            ${torButtonHTML}
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <span style="font-size: 0.7rem; font-weight: 600; text-transform: uppercase; color: ${isOnline ? 'var(--online)' : 'var(--offline)'}">${isOnline ? 'On' : 'Off'}</span>
                                <button
                                    class="toggle-switch ${isOnline ? 'on' : ''}"
                                    aria-label="Toggle ${s.name}"
                                    onclick="toggleService('${s.id}', '${isOnline ? 'stop' : 'start'}', this, '${s.name}')"
                                ></button>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function logout() {
            try {
                await fetch('/api/logout');
                window.location.href = '/login.html';
            } catch(e) {
                window.location.href = '/login.html';
            }
        }

        async function toggleService(id, action, btnElement, serviceName) {
            btnElement.disabled = true;
            const originalText = btnElement.innerText;
            btnElement.innerText = '...';

            try {
                const res = await fetch(`/api/services/${id}/toggle`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action })
                });

                if (res.status === 401) { window.location.href = "/login.html"; return; }
                if (!res.ok) throw new Error(await res.text());

                showToast(`Successfully sent ${action} command to ${serviceName}`, 'success');
                setTimeout(fetchServices, 1000);
            } catch (err) {
                showToast(`Failed to ${action} ${serviceName}`, 'error');
                btnElement.innerText = originalText;
                btnElement.disabled = false;
            }
        }

        async function toggleTorProxy(enable, btnElement) {
            btnElement.disabled = true;
            btnElement.innerText = '...';

            try {
                const res = await fetch('/api/suwayomi/tor', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ enable })
                });

                if (res.status === 401) { window.location.href = "/login.html"; return; }
                if (!res.ok) throw new Error(await res.text());

                showToast(`Tor proxy ${enable ? 'enabled' : 'disabled'} for Suwayomi`, 'success');
                setTimeout(fetchServices, 2000);
            } catch (err) {
                showToast('Failed to toggle Tor proxy', 'error');
                btnElement.disabled = false;
            }
        }

        let torExitActive = false;
        let userRole = "guest";

        async function fetchTorExitStatus() {
            try {
                const res = await fetch('/api/system/tor-exit');
                if(res.status === 401) { window.location.href = "/login.html"; return; }
                if(!res.ok) return;
                const data = await res.json();
                torExitActive = data.active;

                const btn = document.getElementById('tor-exit-btn');
                const banner = document.getElementById('tor-exit-banner');
                const label = document.getElementById('tor-exit-label');

                if (torExitActive) {
                    btn.classList.add('on');
                    label.innerText = 'Enabled';
                    label.style.color = 'var(--online)';
                    banner.classList.add('active');
                } else {
                    btn.classList.remove('on');
                    label.innerText = 'Disabled';
                    label.style.color = 'var(--offline)';
                    banner.classList.remove('active');
                }
                btn.disabled = false;
            } catch (err) {
                console.error("Failed to load Tor Exit status", err);
            }
        }

        async function toggleTorExit() {
            const btn = document.getElementById('tor-exit-btn');
            const label = document.getElementById('tor-exit-label');
            btn.disabled = true;
            label.innerText = '...';

            const newState = !torExitActive;

            try {
                const res = await fetch('/api/system/tor-exit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ enable: newState })
                });

                if (res.status === 401) { window.location.href = "/login.html"; return; }
                if (!res.ok) throw new Error(await res.text());

                showToast('Tor Exit Node status changed', 'success');
                setTimeout(fetchTorExitStatus, 1000);
            } catch (err) {
                showToast('Failed to toggle Tor Exit Node', 'error');
                btn.disabled = false;
            }
        }

        async function fetchUserRole() {
            try {
                const res = await fetch('/api/me');
                if (res.status === 401) { window.location.href = "/login.html"; return; }
                if (res.ok) {
                    const data = await res.json();
                    userRole = data.role;
                    if (userRole !== 'admin') {
                        document.getElementById('tor-exit-banner').style.display = 'none';
                        document.getElementById('stats-bar').style.display = 'none';
                    }
                }
            } catch (e) {
                console.error('Auth check failed:', e);
            }
        }

        async function initDashboard() {
            await fetchUserRole();
            fetchSystemStats();
            fetchServices();
            fetchTorExitStatus();

            // Ultra mode: poll every 15s to minimise server & client load
            // All other themes: poll every 5s for near-realtime updates
            const pollInterval = (savedTheme === 'ultra') ? 15000 : 5000;
            setInterval(() => {
                fetchSystemStats();
                fetchServices();
                fetchTorExitStatus();
            }, pollInterval);
        }

        initDashboard();
    </script>
</body>
</html>
