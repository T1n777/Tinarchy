<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(() => {});
            });
        }
    </script>
    <title>Dashboard</title>

    <script>
        // ─── Universal Zero-Network Wallpaper & Pywal Engine ───
        const DB_NAME = 'PinedashStorage';
        const STORE_NAME = 'wallpapers';

        function openLocalDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, 1);
                req.onupgradeneeded = () => req.result.createObjectStore(STORE_NAME);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function getLocalWallpaper(key = 'active_wallpaper') {
            try {
                const db = await openLocalDB();
                return new Promise((resolve) => {
                    const tx = db.transaction(STORE_NAME, 'readonly');
                    const req = tx.objectStore(STORE_NAME).get(key);
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => resolve(null);
                });
            } catch(e) { return null; }
        }

        async function saveLocalWallpaper(blob, key = 'active_wallpaper') {
            try {
                const db = await openLocalDB();
                const tx = db.transaction(STORE_NAME, 'readwrite');
                tx.objectStore(STORE_NAME).put(blob, key);
            } catch(e) {}
        }

        function applyThemeAndColors(root, pywal) {
            if (!pywal || !pywal.colors) return;
            const userAccent = localStorage.getItem('dashboard-primary-color');
            const pColor = userAccent || pywal.colors.color4 || '#69B4C3';
            const fg = '#ffffff';
            const muted = '#c5d1de';
            root.style.setProperty('--primary', pColor);
            root.style.setProperty('--primary-glow', pColor + '40');
            root.style.setProperty('--text', fg);
            root.style.setProperty('--text-muted', muted);
            root.style.setProperty('--glass-border', pColor + '35');
        }

        function applyMediaToBackground(mediaUrl, isVid = false) {
            const root = document.documentElement;
            const bgDiv = document.querySelector('.wallpaper');
            let vidEl = document.querySelector('.wallpaper-video');
            const isMp4 = isVid || (typeof mediaUrl === 'string' && mediaUrl.toLowerCase().includes('.mp4')) || (localStorage.getItem('dashboard-wallpaper-is-video') === 'true');

            if (isMp4) {
                if (!vidEl && bgDiv) {
                    vidEl = document.createElement('video');
                    vidEl.className = 'wallpaper-video';
                    vidEl.autoplay = true;
                    vidEl.loop = true;
                    vidEl.muted = true;
                    vidEl.playsInline = true;
                    bgDiv.appendChild(vidEl);
                }
                if (vidEl) {
                    vidEl.style.display = 'block';
                    if (vidEl.src !== mediaUrl) vidEl.src = mediaUrl;
                    vidEl.play().catch(() => {});
                }
                if (bgDiv) bgDiv.style.backgroundImage = 'none';
            } else {
                if (vidEl) {
                    vidEl.pause();
                    vidEl.style.display = 'none';
                }
                if (bgDiv) {
                    bgDiv.style.backgroundImage = `url('${mediaUrl}')`;
                    bgDiv.style.backgroundRepeat = 'no-repeat';
                    bgDiv.style.backgroundPosition = 'center center';
                    bgDiv.style.backgroundSize = 'cover';
                }
                root.style.setProperty('--wp-url', `url('${mediaUrl}')`);
            }
        }

        (async function bootSync() {
            const root = document.documentElement;
            const savedTheme = localStorage.getItem('dashboard-theme') || 'glass';
            root.setAttribute('data-theme', savedTheme);
            if (document.body) {
                document.body.setAttribute('data-theme', savedTheme);
            } else {
                document.addEventListener('DOMContentLoaded', () => {
                    document.body.setAttribute('data-theme', savedTheme);
                });
            }

            if (savedTheme === 'solid') {
                root.style.setProperty('--primary', '#69B4C3');
            } else if (savedTheme === 'ultra') {
                root.style.setProperty('--primary', '#7eb8f7');
            } else {
                try {
                    const pywal = JSON.parse(localStorage.getItem('dashboard-pywal') || '{}');
                    applyThemeAndColors(root, pywal);
                } catch(e) {}
            }

            // Blur & Translucency
            applyGlassAndBlur();

            const isVideo = localStorage.getItem('dashboard-wallpaper-is-video') === 'true';
            const wpUrl = localStorage.getItem('dashboard-wallpaper') || localStorage.getItem('login-wallpaper');

            if (isVideo && wpUrl) {
                if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', () => applyMediaToBackground(wpUrl, true));
                } else {
                    applyMediaToBackground(wpUrl, true);
                }
            } else {
                const cachedBlob = await getLocalWallpaper('active_wallpaper');
                if (cachedBlob) {
                    const blobUrl = URL.createObjectURL(cachedBlob);
                    if (document.readyState === 'loading') {
                        document.addEventListener('DOMContentLoaded', () => applyMediaToBackground(blobUrl, false));
                    } else {
                        applyMediaToBackground(blobUrl, false);
                    }
                } else if (wpUrl) {
                    if (document.readyState === 'loading') {
                        document.addEventListener('DOMContentLoaded', () => applyMediaToBackground(wpUrl, false));
                    } else {
                        applyMediaToBackground(wpUrl, false);
                    }
                }
            }
        })();

        (function() {
            const raw = localStorage.getItem('dashboard-ui-scale') || '100';
            const factor = (parseInt(raw, 10) || 100) / 100;
            document.documentElement.style.setProperty('--ui-scale', factor);
        })();

        function applyUiScale(scaleVal) {
            const raw = scaleVal !== undefined ? scaleVal : (localStorage.getItem('dashboard-ui-scale') || '100');
            const val = parseInt(raw, 10);
            const factor = (isNaN(val) ? 100 : val) / 100;
            [document.documentElement, document.body].forEach(el => {
                if (el) el.style.setProperty('--ui-scale', factor);
            });
            const container = document.querySelector('.container');
            if (container) container.style.zoom = factor;
        }

        function applyGlassAndBlur(blurVal, transVal) {
            const blur = blurVal !== undefined ? blurVal : (localStorage.getItem('dashboard-blur') || '16');
            const transRaw = transVal !== undefined ? transVal : (localStorage.getItem('dashboard-glass-translucency') || '60');
            const val = parseInt(transRaw, 10);
            const t = isNaN(val) ? 0.6 : val / 100;
            const alpha = (0.95 - (t * 0.80)).toFixed(2);
            const uiBlur = `${Math.round(t * 30)}px`;
            const wpBlur = `${blur}px`;

            [document.documentElement, document.body].forEach(el => {
                if (!el) return;
                el.style.setProperty('--wp-blur', wpBlur);
                el.style.setProperty('--ui-translucency', t);
                el.style.setProperty('--glass-alpha', alpha);
                el.style.setProperty('--glass', `rgba(var(--glass-rgb, 14, 19, 34), ${alpha})`);
                el.style.setProperty('--ui-blur', uiBlur);
                el.style.setProperty('--ui-saturate', '180%');
            });

            const bg = document.querySelector('.wallpaper');
            if (bg) bg.style.filter = `blur(${wpBlur})`;
        }

        window.addEventListener('pageshow', () => {
            const theme = localStorage.getItem('dashboard-theme') || 'glass';
            document.documentElement.setAttribute('data-theme', theme);
            if (document.body) document.body.setAttribute('data-theme', theme);
            applyGlassAndBlur();
            applyUiScale();
            try {
                const pywal = JSON.parse(localStorage.getItem('dashboard-pywal') || '{}');
                applyThemeAndColors(document.documentElement, pywal);
                if (document.body) applyThemeAndColors(document.body, pywal);
            } catch(err) {}
        });
        window.addEventListener('storage', (e) => {
            if (e.key === 'dashboard-theme') {
                const theme = e.newValue || 'glass';
                document.documentElement.setAttribute('data-theme', theme);
                if (document.body) document.body.setAttribute('data-theme', theme);
            } else if (e.key === 'dashboard-blur') {
                applyGlassAndBlur(e.newValue, undefined);
            } else if (e.key === 'dashboard-glass-translucency') {
                applyGlassAndBlur(undefined, e.newValue);
            } else if (e.key === 'dashboard-ui-scale') {
                applyUiScale(e.newValue);
            } else if (e.key === 'dashboard-primary-color' || e.key === 'dashboard-pywal') {
                try {
                    const pywal = JSON.parse(localStorage.getItem('dashboard-pywal') || '{}');
                    applyThemeAndColors(document.documentElement, pywal);
                    if (document.body) applyThemeAndColors(document.body, pywal);
                } catch(err) {}
            } else if (e.key === 'dashboard-wallpaper' || e.key === 'dashboard-wallpaper-is-video') {
                const isVideo = localStorage.getItem('dashboard-wallpaper-is-video') === 'true';
                const wpUrl = localStorage.getItem('dashboard-wallpaper');
                if (wpUrl) applyMediaToBackground(wpUrl, isVideo);
            }
        });
        document.addEventListener('DOMContentLoaded', () => {
            applyGlassAndBlur();
            applyUiScale();
        });
    </script>

    <style>
        /* Solid Dark Theme Override */
        :root[data-theme="solid"],
        body[data-theme="solid"] {
            --bg: #0b0d13;
            --glass-rgb: 20, 23, 34;
            --glass: #141722;
            --glass-hover: #1b1e2a;
            --glass-border: rgba(255, 255, 255, 0.06);
            --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            background-color: var(--bg) !important;
        }
        body[data-theme="solid"] .wallpaper-container,
        body[data-theme="solid"] .wallpaper,
        body[data-theme="solid"] .wallpaper-tint {
            display: none !important;
        }
        body[data-theme="solid"] .glass,
        body[data-theme="solid"] .card,
        body[data-theme="solid"] .stat-card,
        body[data-theme="solid"] .top-nav,
        body[data-theme="solid"] .tailnet-drawer,
        body[data-theme="solid"] .tor-exit-banner,
        body[data-theme="solid"] .toast {
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3) !important;
            background: var(--glass) !important;
        }

        /* Ultra Performance Theme Override */
        :root[data-theme="ultra"],
        body[data-theme="ultra"] {
            --bg: #0d0d0d;
            --glass: #181818;
            --glass-hover: #222222;
            --glass-border: rgba(255, 255, 255, 0.08);
            --card-shadow: none;
            background-color: var(--bg) !important;
        }
        body[data-theme="ultra"] .wallpaper-container,
        body[data-theme="ultra"] .wallpaper,
        body[data-theme="ultra"] .wallpaper-tint {
            display: none !important;
        }
        body[data-theme="ultra"] *,
        body[data-theme="ultra"] *::before,
        body[data-theme="ultra"] *::after {
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            box-shadow: none !important;
            transition: none !important;
            animation: none !important;
        }
        body[data-theme="ultra"] .glass,
        body[data-theme="ultra"] .card,
        body[data-theme="ultra"] .stat-card,
        body[data-theme="ultra"] .top-nav,
        body[data-theme="ultra"] .tailnet-drawer,
        body[data-theme="ultra"] .tor-exit-banner,
        body[data-theme="ultra"] .toast {
            background: var(--glass) !important;
            border: 1px solid var(--glass-border) !important;
            border-radius: 8px !important;
        }

        :root, :root[data-theme="glass"] {
            --bg: #0a0f1e;
            --glass-rgb: 14, 19, 34;
            --glass-alpha: 0.65;
            --ui-translucency: 0.6;
            --ui-blur: 24px;
            --ui-saturate: 180%;
            --ui-scale: 1;
            --glass: rgba(var(--glass-rgb), var(--glass-alpha));
            --glass-hover: rgba(22, 28, 44, 0.85);
            --glass-border: rgba(105, 180, 195, 0.25);
            --glass-border-hover: rgba(105, 180, 195, 0.55);
            --shadow-inner: inset 0 1px 1px rgba(255, 255, 255, 0.16);
            --shadow-outer: 0 12px 40px rgba(0, 0, 0, 0.45);
            --card-shadow: var(--shadow-inner), var(--shadow-outer);

            --text: #ffffff;
            --text-muted: #c5d1de;
            --primary: #69B4C3;
            --primary-hover: #7fc3d1;
            --primary-glow: rgba(105, 180, 195, 0.35);
            --accent-gold: #AE9E5C;
            --online: #4edea3;
            --offline: #ffb4ab;
            --tor-purple: #ddb7ff;
            --tor-bg: rgba(111, 0, 190, 0.15);
            --tor-border: rgba(214, 169, 255, 0.35);

            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --wp-blur: 16px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-family);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        .wallpaper-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            z-index: -2;
            pointer-events: none;
        }

        /* Razor-sharp Wallpaper Background */
        .wallpaper {
            position: absolute;
            top: -20px;
            left: -20px;
            right: -20px;
            bottom: -20px;
            width: calc(100% + 40px);
            height: calc(100% + 40px);
            background: var(--wp-url, url('/dashboard-bg.jpg')) no-repeat center center;
            background-size: cover;
            filter: blur(var(--wp-blur));
            transform: translateZ(0);
            transition: filter 0.2s ease;
        }

        .wallpaper-video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: translateZ(0);
            pointer-events: none;
        }

        .wallpaper-tint {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            background: rgba(0, 0, 0, 0.42);
            z-index: -1;
            pointer-events: none;
        }

        /* Razor-sharp Glass System */
        .glass {
            background: var(--glass);
            backdrop-filter: blur(var(--ui-blur)) saturate(var(--ui-saturate));
            -webkit-backdrop-filter: blur(var(--ui-blur)) saturate(var(--ui-saturate));
            border: 1px solid var(--glass-border);
            box-shadow: var(--card-shadow);
            border-radius: 16px;
            transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .glass:hover {
            background: var(--glass-hover);
            border-color: var(--glass-border-hover);
        }

        /* Layout */
        .container {
            position: relative;
            z-index: 1;
            max-width: 1240px;
            margin: 0 auto;
            padding: 10px 20px 24px;
            zoom: var(--ui-scale, 1);
        }

        /* Universal Text Selection (Pywal Accented) */
        ::selection {
            background: var(--primary);
            color: #0b0f14;
            text-shadow: none;
        }
        ::-moz-selection {
            background: var(--primary);
            color: #0b0f14;
            text-shadow: none;
        }

        /* Top Nav Pill */
        .top-nav-wrapper {
            position: sticky;
            top: 8px;
            z-index: 50;
            display: flex;
            justify-content: center;
            margin: 0 0 10px;
            pointer-events: none;
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 20px;
            background: var(--glass);
            backdrop-filter: blur(var(--ui-blur)) saturate(var(--ui-saturate));
            -webkit-backdrop-filter: blur(var(--ui-blur)) saturate(var(--ui-saturate));
            border: 1px solid var(--glass-border);
            border-radius: 999px;
            box-shadow: var(--shadow-inner), 0 8px 32px rgba(0, 0, 0, 0.35);
            gap: 18px;
            pointer-events: all;
            width: fit-content;
            max-width: calc(100% - 32px);
        }

        .top-nav .brand {
            font-size: 1.18rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 8px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .pulse-beacon {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--online);
            box-shadow: 0 0 10px var(--online);
            display: inline-block;
        }

        .top-nav .meta {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .meta-badge {
            font-size: 0.8rem;
            font-weight: 600;
            font-family: var(--font-mono);
            color: #e6edf3;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 3px 12px;
            border-radius: 999px;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
        }

        .nav-btn {
            font-family: inherit;
            font-size: 1.05rem;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            cursor: pointer;
            width: 36px;
            height: 36px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s ease;
            text-decoration: none;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
            flex-shrink: 0;
        }

        .nav-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
            color: #0b0f14;
            transform: translateY(-1px);
            box-shadow: 0 4px 14px var(--primary-glow);
            text-shadow: none;
        }

        .nav-btn-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            line-height: 1;
        }

        .nav-btn-text {
            display: none !important;
        }
        /* ─── Stats Bar ─── */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 12px;
            margin: 0 0 10px;
        }

        .stat-card {
            border-radius: 14px;
            padding: 12px 16px;
            transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--card-shadow), 0 0 16px var(--primary-glow);
            border-color: var(--primary);
        }

        .stat-card .stat-label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .stat-card .stat-value {
            font-size: 1.15rem;
            font-weight: 800;
            font-feature-settings: "tnum";
            font-variant-numeric: tabular-nums;
            color: var(--text);
            margin-bottom: 6px;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 999px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            border-radius: 999px;
            transition: width 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        /* ─── Tor Exit Banner ─── */
        .tor-exit-banner {
            border-radius: 14px;
            padding: 10px 18px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--tor-bg);
            border: 1px solid var(--tor-border);
            transition: all 0.3s;
        }

        .tor-exit-banner:hover {
            border-color: var(--tor-purple);
            box-shadow: 0 0 20px rgba(214, 169, 255, 0.25);
        }

        .tor-exit-info { display: flex; align-items: center; gap: 14px; flex: 1; min-width: 0; }
        .tor-exit-text { flex: 1; min-width: 0; }

        .tor-icon {
            width: 38px; height: 38px;
            border-radius: 10px;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--tor-border);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.15rem; flex: 0 0 38px;
        }

        .tor-exit-info h2 {
            font-size: 1rem;
            font-weight: 700;
            color: var(--tor-purple);
            margin-bottom: 2px;
        }

        .tor-exit-info p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* ─── Services Grid ─── */
        .section-title {
            font-size: 1.12rem;
            font-weight: 800;
            margin-bottom: 10px;
            color: var(--text);
            letter-spacing: -0.02em;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        @media (max-width: 1024px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
                gap: 10px;
            }
        }

        .card {
            border-radius: 14px;
            padding: 15px 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 140px;
            transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .card:hover {
            border-color: var(--primary) !important;
            box-shadow: var(--card-shadow), 0 0 20px var(--primary-glow);
            transform: translateY(-2px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .service-icon {
            font-size: 1.4rem;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .status-badge {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 3px 10px;
            border-radius: 100px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-badge::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        .status-badge.online {
            color: var(--online);
            background: rgba(78, 222, 163, 0.12);
            border: 1px solid rgba(78, 222, 163, 0.3);
        }
        .status-badge.online::before {
            background: var(--online);
            box-shadow: 0 0 8px var(--online);
        }

        .status-badge.offline {
            color: var(--offline);
            background: rgba(255, 180, 171, 0.12);
            border: 1px solid rgba(255, 180, 171, 0.3);
        }
        .status-badge.offline::before {
            background: var(--offline);
        }

        .service-details h2 {
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 2px;
            color: var(--text);
        }

        .service-link {
            text-decoration: none;
            color: inherit;
        }

        .service-link:hover h2 {
            color: var(--primary);
        }

        .service-details p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            line-height: 1.35;
        }

        .systemd-name {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: rgba(255,255,255,0.4);
            margin-bottom: 8px;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.06);
        }

        .port {
            font-family: var(--font-mono);
            font-size: 0.78rem;
            font-weight: 600;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            letter-spacing: 0.02em;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            transition: all 0.2s ease;
        }

        .port:hover {
            background: var(--primary);
            color: #0b0f14;
            border-color: var(--primary);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* ─── Tactile Organic Toggle Switch with Fluid Physics ─── */
        .toggle-switch {
            width: 46px;
            height: 26px;
            flex-shrink: 0;
            touch-action: manipulation;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid var(--glass-border);
            border-radius: 100px;
            cursor: pointer;
            position: relative;
            outline: none;
            transition: background 0.3s cubic-bezier(0.34, 1.56, 0.64, 1),
                        border-color 0.3s ease,
                        box-shadow 0.3s ease,
                        transform 0.15s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .toggle-switch:active {
            transform: scale(0.92);
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #ffffff;
            transition: transform 0.38s cubic-bezier(0.34, 1.56, 0.64, 1),
                        background 0.3s ease;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.45);
        }

        .toggle-switch.on {
            background: var(--online);
            border-color: var(--online);
            box-shadow: 0 0 12px rgba(78, 222, 163, 0.35);
        }

        .toggle-switch.on::after {
            transform: translateX(20px);
            background: #0a0f1e;
        }

        /* Fluid Transitional / Spin-up State */
        .toggle-switch.transitioning {
            background: rgba(252, 196, 25, 0.35) !important;
            border-color: #fcc419 !important;
            box-shadow: 0 0 15px rgba(252, 196, 25, 0.45) !important;
            cursor: wait;
        }

        .toggle-switch.transitioning::after {
            animation: pulseThumb 0.8s infinite alternate ease-in-out;
            background: #fcc419 !important;
        }

        @keyframes pulseThumb {
            from { transform: translateX(8px) scale(0.85); opacity: 0.8; }
            to { transform: translateX(12px) scale(1.1); opacity: 1; }
        }

        @keyframes cardWake {
            0% { border-color: rgba(78, 222, 163, 0.2); box-shadow: var(--card-shadow); }
            50% { border-color: var(--online); box-shadow: var(--card-shadow), 0 0 28px rgba(78, 222, 163, 0.45); }
            100% { border-color: var(--glass-border); box-shadow: var(--card-shadow); }
        }

        .card.wake-up {
            animation: cardWake 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .status-badge.transitioning {
            color: #fcc419;
            background: rgba(252, 196, 25, 0.15);
            border-color: rgba(252, 196, 25, 0.4);
            animation: pulseBadge 0.9s infinite alternate;
        }

        .status-badge.transitioning::before {
            background: #fcc419;
            box-shadow: 0 0 8px #fcc419;
        }

        @keyframes pulseBadge {
            from { opacity: 0.65; transform: scale(0.97); }
            to { opacity: 1; transform: scale(1.03); }
        }

        /* Toast */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }

        .toast {
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 0.86rem;
            font-weight: 600;
            color: var(--text);
            background: rgba(14, 19, 34, 0.9);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            pointer-events: auto;
            transition: opacity 0.3s, transform 0.3s;
        }

        .toast.success { border-color: var(--online); color: var(--online); }
        .toast.error { border-color: var(--offline); color: var(--offline); }

        /* ─── Responsive Styles ─── */
        /* Tablet & Small Screens (≤ 768px): List Layout + Smaller Tiles */
        @media (max-width: 768px) {
            /* Lightweight GPU blur for silky-smooth phone scrolling */
            .glass, .card, .stat-card, .tor-exit-banner {
                backdrop-filter: blur(8px) saturate(130%) !important;
                -webkit-backdrop-filter: blur(8px) saturate(130%) !important;
                background: rgba(var(--glass-rgb), 0.85) !important;
                transform: translateZ(0);
            }
            .top-nav {
                backdrop-filter: blur(10px) saturate(140%) !important;
                -webkit-backdrop-filter: blur(10px) saturate(140%) !important;
                background: rgba(var(--glass-rgb), 0.88) !important;
            }

            .grid {
                grid-template-columns: 1fr !important;
                gap: 10px !important;
            }

            /* Scaled-down Tiles for Small Screens */
            .card {
                padding: 10px 14px !important;
                min-height: 104px !important;
                border-radius: 12px !important;
            }

            .card-header {
                margin-bottom: 4px !important;
            }

            .service-icon {
                width: 32px !important;
                height: 32px !important;
                font-size: 1.15rem !important;
                border-radius: 8px !important;
            }

            .status-badge {
                font-size: 0.65rem !important;
                padding: 2px 8px !important;
            }

            .service-details h2 {
                font-size: 0.95rem !important;
                margin-bottom: 2px !important;
            }

            .service-details p {
                font-size: 0.74rem !important;
                margin-bottom: 4px !important;
                line-height: 1.3 !important;
            }

            .systemd-name {
                font-size: 0.64rem !important;
                margin-bottom: 4px !important;
            }

            .card-footer {
                padding-top: 6px !important;
            }

            .port {
                font-size: 0.72rem !important;
                padding: 2px 6px !important;
            }

            .actions {
                gap: 8px !important;
            }

            .toggle-switch {
                width: 40px !important;
                height: 22px !important;
            }

            .toggle-switch::after {
                width: 16px !important;
                height: 16px !important;
                top: 2px !important;
                left: 2px !important;
            }

            .toggle-switch.on::after {
                transform: translateX(18px) !important;
            }
        }

        /* Mobile Screens (≤ 640px) */
        @media (max-width: 640px) {
            .container {
                padding: 8px 12px 24px !important;
            }

            /* Top Nav Floating Pill on Mobile */
            .top-nav-wrapper {
                margin: 6px 0 12px !important;
                top: 8px !important;
                width: 100% !important;
            }
            .top-nav {
                width: 100% !important;
                max-width: 100% !important;
                border-radius: 999px !important;
                padding: 6px 12px !important;
                gap: 8px !important;
                justify-content: space-between !important;
                box-sizing: border-box !important;
            }
            .top-nav .brand {
                font-size: 0.95rem !important;
                gap: 6px !important;
                flex-shrink: 1 !important;
                min-width: 0 !important;
            }
            .top-nav .brand span:nth-child(2) {
                max-width: clamp(120px, 40vw, 200px) !important;
                overflow: hidden !important;
                text-overflow: ellipsis !important;
                white-space: nowrap !important;
            }
            .top-nav .meta {
                display: none !important;
            }
            .nav-actions {
                display: flex !important;
                gap: 6px !important;
                align-items: center !important;
                flex-shrink: 0 !important;
            }
            #nav-user-pill {
                padding: 0 !important;
                background: transparent !important;
                border: none !important;
                gap: 0 !important;
            }
            #nav-user-name,
            #nav-user-role {
                display: none !important;
            }
            #nav-user-avatar {
                width: 26px !important;
                height: 26px !important;
                box-shadow: 0 0 0 1.5px var(--glass-border) !important;
            }
            .nav-btn {
                padding: 0 !important;
                width: 28px !important;
                height: 28px !important;
                min-width: 28px !important;
                border-radius: 50% !important;
                justify-content: center !important;
                font-size: 0.85rem !important;
            }
            .nav-btn-text {
                display: none !important;
            }
            .nav-btn-icon {
                display: inline-block !important;
                font-size: 0.95rem !important;
                line-height: 1 !important;
            }

            /* Stats Grid on Mobile: 2 per row */
            .stats-bar {
                grid-template-columns: repeat(2, 1fr) !important;
                gap: 8px !important;
                margin: 0 0 10px !important;
            }
            .stat-card {
                padding: 10px 12px !important;
                min-width: 0 !important;
                overflow: hidden !important;
            }
            .stat-card .stat-label {
                font-size: 0.72rem !important;
                white-space: nowrap !important;
                overflow: hidden !important;
                text-overflow: ellipsis !important;
            }
            .stat-value {
                font-size: clamp(0.9rem, 3.4vw, 1.1rem) !important;
                white-space: nowrap !important;
                overflow: hidden !important;
                text-overflow: ellipsis !important;
            }

            /* Tor Exit Banner */
            .tor-exit-banner {
                padding: 8px 12px !important;
                gap: 10px !important;
                margin-bottom: 10px !important;
            }
            .tor-icon {
                width: 32px !important;
                height: 32px !important;
                font-size: 1rem !important;
                flex: 0 0 32px !important;
            }
            .tor-exit-info h2 {
                font-size: 0.88rem !important;
            }
            .tor-exit-info p {
                font-size: 0.72rem !important;
                line-height: 1.25 !important;
            }
            #tor-exit-btn {
                flex-shrink: 0 !important;
            }

            /* Extra Tile Compactness on Mobile */
            .card {
                padding: 9px 12px !important;
                min-height: 96px !important;
            }
            .service-icon {
                width: 30px !important;
                height: 30px !important;
                font-size: 1.1rem !important;
            }
            .service-details h2 {
                font-size: 0.92rem !important;
            }
            .service-details p {
                font-size: 0.72rem !important;
                line-height: 1.25 !important;
                margin-bottom: 3px !important;
            }
        }

        /* Small Phones (≤ 380px) */
        @media (max-width: 380px) {
            .container {
                padding: 6px 8px 20px !important;
            }
            .top-nav .brand span:nth-child(2) {
                max-width: clamp(90px, 32vw, 130px) !important;
            }
            .top-nav {
                padding: 4px 8px !important;
            }
            .stat-card {
                padding: 8px 10px !important;
            }
            .card {
                padding: 8px 10px !important;
                min-height: 90px !important;

        }
    </style>
</head>
<body>
    <div class="wallpaper-container">
        <div class="wallpaper"><video class="wallpaper-video" autoplay loop muted playsinline style="display:none;"></video></div>
    </div>
    <div class="wallpaper-tint"></div>

    <div class="container">
        <!-- Top Navigation Pill -->
        <div class="top-nav-wrapper">
            <nav class="top-nav">
                <div class="brand">
                    <span id="brand-icon">🍍</span>
                    <span id="sys-hostname">Server</span>
                    <span class="pulse-beacon"></span>
                </div>
                <div class="meta">
                    <span class="meta-badge" id="sys-tailscale">IP: ...</span>
                    <span class="meta-badge" id="sys-uptime">Up: ...</span>
                </div>
                <div class="nav-actions" style="display: flex; gap: 8px; align-items: center;">
                    <div id="nav-user-pill" title="User Profile" style="display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.06); width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--glass-border); flex-shrink: 0; cursor: default;">
                        <div id="nav-user-avatar" style="width: 28px; height: 28px; border-radius: 50%; background: var(--primary); color: #000; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:0.8rem; overflow:hidden;">Y</div>
                        <span id="nav-user-name" style="display:none;">Owner</span>
                        <span id="nav-user-role" style="display:none;">👑 Owner</span>
                    </div>
                    <a href="/settings" class="nav-btn nav-btn-settings" title="Settings" aria-label="Settings">
                        <span class="nav-btn-icon">⚙️</span>
                    </a>
                    <button class="nav-btn nav-btn-refresh" onclick="fetchSystemStats(true)" title="Refresh Telemetry" aria-label="Refresh Telemetry">
                        <span class="nav-btn-icon">↻</span>
                    </button>
                </div>
            </nav>
        </div>

        <!-- Stats Bar -->
        <div class="stats-bar" id="stats-bar">
            <!-- CPU Temp -->
            <div class="stat-card glass">
                <div class="stat-label">CPU Temp</div>
                <div class="stat-value" id="temp-text">--°C</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="temp-bar" style="width: 0%"></div>
                </div>
            </div>

            <!-- CPU Load -->
            <div class="stat-card glass">
                <div class="stat-label">CPU Load</div>
                <div class="stat-value" id="cpu-text">...</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="cpu-bar" style="width: 0%"></div>
                </div>
            </div>

            <!-- RAM -->
            <div class="stat-card glass">
                <div class="stat-label">RAM Memory</div>
                <div class="stat-value" id="ram-text">...</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="ram-bar" style="width: 0%"></div>
                </div>
            </div>

            <!-- Disk -->
            <div class="stat-card glass">
                <div class="stat-label">Storage SSD</div>
                <div class="stat-value" id="disk-text">...</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="disk-bar" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <!-- Tor Exit Banner -->
        <div class="tor-exit-banner glass" id="tor-exit-banner">
            <div class="tor-exit-info">
                <div class="tor-icon">🧅</div>
                <div class="tor-exit-text">
                    <h2>Global Tor Exit Node <span id="tor-exit-label" style="font-size: 0.72rem; text-transform: uppercase;"></span></h2>
                    <p>Route all Tailscale client traffic through the Tor onion network.</p>
                </div>
            </div>
            <button class="toggle-switch" aria-label="Toggle Tor Exit Node" id="tor-exit-btn" onclick="toggleTorExit()">
            </button>
        </div>

        <!-- Services Grid -->
        <h2 class="section-title">Server Applications</h2>
        <div class="grid" id="services-container"></div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script>
        const container = document.getElementById('services-container');
        const toastContainer = document.getElementById('toast-container');

        function showToast(message, type = 'default') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = message;
            toastContainer.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(8px)';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        let LAST_SYS_STATS = {};
        function applySystemStatsToUI(stats) {
            if (!stats) return;
            // Accumulate incoming delta into LAST_SYS_STATS state
            Object.assign(LAST_SYS_STATS, stats);
            const current = LAST_SYS_STATS;

            // Dynamic Name & Branding
            const serverName = current.display_name || current.server_name || 'Server';
            if (current._lastRenderedServerName !== serverName) {
                const hostEl = document.getElementById('sys-hostname');
                if (hostEl) hostEl.textContent = serverName;
                const projectName = current.project_name || 'Tinarchy';
                document.title = `${serverName} - ${projectName}`;
                current._lastRenderedServerName = serverName;
            }
            if (current.app_icon && current._lastRenderedAppIcon !== current.app_icon) {
                const iconEl = document.getElementById('brand-icon');
                if (iconEl) iconEl.textContent = current.app_icon;
                current._lastRenderedAppIcon = current.app_icon;
            }

            if (current.tailscale_ip && current._lastRenderedTailscaleIp !== current.tailscale_ip) {
                const tsEl = document.getElementById('sys-tailscale');
                if (tsEl) tsEl.textContent = `IP: ${current.tailscale_ip}`;
                current._lastRenderedTailscaleIp = current.tailscale_ip;
            }
            if (current.uptime && current._lastRenderedUptime !== current.uptime) {
                const upEl = document.getElementById('sys-uptime');
                if (upEl) upEl.textContent = `Up: ${current.uptime}`;
                current._lastRenderedUptime = current.uptime;
            }

            // RAM
            if (current.ram_used_mb !== undefined && current.ram_total_mb !== undefined) {
                const ramTxt = `${current.ram_used_mb}MB / ${current.ram_total_mb}MB`;
                if (current._lastRenderedRamTxt !== ramTxt) {
                    const ramEl = document.getElementById('ram-text');
                    if (ramEl) ramEl.textContent = ramTxt;
                    current._lastRenderedRamTxt = ramTxt;
                }
                const ramPercentStr = `${current.ram_percent}%`;
                const ramBar = document.getElementById('ram-bar');
                if (ramBar && ramBar.style.width !== ramPercentStr) {
                    ramBar.style.width = ramPercentStr;
                    ramBar.style.backgroundColor = current.ram_percent > 85 ? '#ffb4ab' : (current.ram_percent > 70 ? '#fcc419' : 'var(--primary)');
                }
            }

            // Disk
            if (current.disk_used && current.disk_total) {
                const diskTxt = `${current.disk_used} / ${current.disk_total}`;
                if (current._lastRenderedDiskTxt !== diskTxt) {
                    const diskEl = document.getElementById('disk-text');
                    if (diskEl) diskEl.textContent = diskTxt;
                    current._lastRenderedDiskTxt = diskTxt;
                }
                const diskPercentStr = `${current.disk_percent}%`;
                const diskBar = document.getElementById('disk-bar');
                if (diskBar && diskBar.style.width !== diskPercentStr) {
                    diskBar.style.width = diskPercentStr;
                }
            }

            // CPU Load
            if (current.cpu_percent !== undefined) {
                const cpuTxt = `${current.cpu_percent}% (${current.loadavg ? current.loadavg[0] : '0.00'})`;
                if (current._lastRenderedCpuTxt !== cpuTxt) {
                    const cpuEl = document.getElementById('cpu-text');
                    if (cpuEl) cpuEl.textContent = cpuTxt;
                    current._lastRenderedCpuTxt = cpuTxt;
                }
                const cpuPercentStr = `${current.cpu_percent}%`;
                const cpuBar = document.getElementById('cpu-bar');
                if (cpuBar && cpuBar.style.width !== cpuPercentStr) {
                    cpuBar.style.width = cpuPercentStr;
                }
            }

            // CPU Temp
            if (current.cpu_temp) {
                if (current._lastRenderedCpuTemp !== current.cpu_temp) {
                    const tempEl = document.getElementById('temp-text');
                    if (tempEl) tempEl.textContent = current.cpu_temp;
                    current._lastRenderedCpuTemp = current.cpu_temp;
                }
                const tempBar = document.getElementById('temp-bar');
                if (tempBar) {
                    const tempVal = current.cpu_temp_val || parseInt(current.cpu_temp, 10) || 45;
                    const tempPercentStr = `${Math.min(100, Math.max(0, (tempVal / 90) * 100))}%`;
                    if (tempBar.style.width !== tempPercentStr) {
                        tempBar.style.width = tempPercentStr;
                        tempBar.style.backgroundColor = tempVal > 78 ? '#ffb4ab' : (tempVal > 65 ? '#fcc419' : 'var(--primary)');
                    }
                }
            }
        }

        async function fetchSystemStats(manual = false) {
            if (document.hidden && !manual) return;
            try {
                const res = await fetch('/api/system');
                if(!res.ok) return;
                const stats = await res.json();
                applySystemStatsToUI(stats);
                if (manual) showToast('Telemetry synchronized', 'success');
            } catch (err) {}
        }

        let sseSource = null;
        let sseActive = false;
        function initTelemetryStream() {
            if (!window.EventSource) {
                sseActive = false;
                return;
            }
            try {
                if (sseSource) sseSource.close();
                sseSource = new EventSource('/api/events/telemetry');
                const onTelemetryMsg = (e) => {
                    sseActive = true;
                    try {
                        const stats = JSON.parse(e.data);
                        applySystemStatsToUI(stats);
                    } catch (err) {}
                };
                sseSource.addEventListener('telemetry', onTelemetryMsg);
                sseSource.addEventListener('telemetry_full', onTelemetryMsg);
                sseSource.onerror = () => {
                    sseActive = false;
                };
            } catch (e) {
                sseActive = false;
            }
        }

        async function fetchServices() {
            try {
                const res = await fetch('/api/services');
                if(!res.ok) return;
                const data = await res.json();
                renderServices(data);
            } catch (err) {}
        }

        function renderServices(services) {
            container.innerHTML = '';
            if (!services || services.length === 0) {
                container.innerHTML = `
                    <div class="card glass" style="grid-column: 1 / -1; padding: 2.5rem 1.5rem; text-align: center; border-radius: 16px;">
                        <div style="font-size: 2.5rem; margin-bottom: 10px;">🔒</div>
                        <h2 style="font-size: 1.15rem; margin-bottom: 6px;">No Sites Assigned</h2>
                        <p style="color: var(--text-muted); font-size: 0.85rem; max-width: 420px; margin: 0 auto; line-height: 1.5;">You currently do not have access to any sites on this server. Contact the server owner to grant you access.</p>
                    </div>
                `;
                return;
            }
            services.forEach(s => {
                const isOnline = s.status === 'online';
                const isSuwayomi = s.id === 'suwayomi';
                const isTorEnabled = isSuwayomi ? s.torProxyEnabled : false;

                const card = document.createElement('div');
                card.className = 'card glass';

                let torButtonHTML = '';
                if (isSuwayomi && isOnline) {
                    torButtonHTML = `
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <span style="font-size: 0.7rem; font-weight: 600; text-transform: uppercase; color: var(--text-muted)">Tor Proxy</span>
                            <button
                                class="toggle-switch ${isTorEnabled ? 'on' : ''}"
                                aria-label="Toggle Tor Proxy"
                                onclick="toggleTorProxy(${!isTorEnabled}, this)"
                            ></button>
                        </div>
                    `;
                }

                const serviceLink = s.link || `/${s.id}`;
                const launchUrl = serviceLink;
                const titleHTML = isOnline
                    ? `<a href="${launchUrl}" target="_blank" class="service-link"><h2>${s.name} ↗</h2></a>`
                    : `<h2>${s.name}</h2>`;

                card.innerHTML = `
                    <div class="card-header">
                        <div class="service-icon">${s.icon || '⚙️'}</div>
                        <div class="status-badge ${s.status}">${s.status}</div>
                    </div>
                    <div class="service-details">
                        ${titleHTML}
                        <p>${s.description}</p>
                        <div class="systemd-name">${s.systemd_name || (s.systemd + '.service')}</div>
                    </div>
                    <div class="card-footer">
                        <a href="${launchUrl}" target="_blank" class="port" title="Open ${serviceLink}">${s.link_text || serviceLink}</a>
                        <div class="actions">
                            ${torButtonHTML}
                            ${CURRENT_USER.role === 'viewer' ? '<span style="font-size:0.72rem; color:var(--text-muted); font-weight:600; background:rgba(255,255,255,0.06); padding:2px 8px; border-radius:6px;">Viewer (Read-Only)</span>' : `
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <span style="font-size: 0.7rem; font-weight: 700; text-transform: uppercase; color: ${isOnline ? 'var(--online)' : 'var(--offline)'}">${isOnline ? 'On' : 'Off'}</span>
                                <button
                                    class="toggle-switch ${isOnline ? 'on' : ''}"
                                    aria-label="Toggle ${s.name}"
                                    onclick="toggleService('${s.id}', '${isOnline ? 'stop' : 'start'}', this, '${s.name}')"
                                ></button>
                            </div>
                            `}
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function toggleService(id, action, btnElement, serviceName) {
            if (CURRENT_USER.role === 'viewer') {
                showToast('Viewer mode: Read-only access', 'error');
                return;
            }

            const card = btnElement.closest('.card');
            const badge = card ? card.querySelector('.status-badge') : null;
            const label = btnElement.previousElementSibling;
            const prevOnline = btnElement.classList.contains('on');

            // 1. Natural Tactile & Optimistic UI
            btnElement.disabled = true;
            btnElement.classList.add('transitioning');
            if (badge) {
                badge.className = 'status-badge transitioning';
                badge.textContent = action === 'start' ? 'Starting…' : 'Stopping…';
            }
            if (label) {
                label.textContent = action === 'start' ? 'Starting' : 'Stopping';
                label.style.color = '#fcc419';
            }

            try {
                const res = await fetch(`/api/services/${id}/toggle`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action })
                });

                if (!res.ok) throw new Error(await res.text());
                const data = await res.json();
                if (!data.success) throw new Error(data.error || 'Operation failed');

                // 2. Smooth Success Spring Animation
                btnElement.classList.remove('transitioning');
                if (action === 'start') {
                    btnElement.classList.add('on');
                    btnElement.setAttribute('onclick', `toggleService('${id}', 'stop', this, '${serviceName}')`);
                    if (card) {
                        card.classList.add('wake-up');
                        setTimeout(() => card.classList.remove('wake-up'), 1300);
                    }
                    if (badge) {
                        badge.className = 'status-badge online';
                        badge.textContent = 'online';
                    }
                    if (label) {
                        label.textContent = 'On';
                        label.style.color = 'var(--online)';
                    }
                    showToast(`✨ ${serviceName} started smoothly`, 'success');
                } else {
                    btnElement.classList.remove('on');
                    btnElement.setAttribute('onclick', `toggleService('${id}', 'start', this, '${serviceName}')`);
                    if (badge) {
                        badge.className = 'status-badge offline';
                        badge.textContent = 'offline';
                    }
                    if (label) {
                        label.textContent = 'Off';
                        label.style.color = 'var(--offline)';
                    }
                    showToast(`🛑 ${serviceName} stopped`, 'default');
                }
                setTimeout(fetchServices, 1200);
            } catch (err) {
                // Rollback smoothly on failure
                btnElement.classList.remove('transitioning');
                if (prevOnline) btnElement.classList.add('on');
                else btnElement.classList.remove('on');
                if (badge) {
                    badge.className = `status-badge ${prevOnline ? 'online' : 'offline'}`;
                    badge.textContent = prevOnline ? 'online' : 'offline';
                }
                if (label) {
                    label.textContent = prevOnline ? 'On' : 'Off';
                    label.style.color = prevOnline ? 'var(--online)' : 'var(--offline)';
                }
                showToast(`Failed to ${action} ${serviceName}: ${err}`, 'error');
            } finally {
                btnElement.disabled = false;
            }
        }

        async function toggleTorProxy(enable, btnElement) {
            btnElement.disabled = true;
            try {
                const res = await fetch('/api/suwayomi/tor', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ enable })
                });
                if (!res.ok) throw new Error(await res.text());
                showToast(`Suwayomi Tor proxy ${enable ? 'enabled' : 'disabled'}`, 'success');
                setTimeout(fetchServices, 1000);
            } catch(e) {
                showToast(`Failed to toggle Tor: ${e}`, 'error');
            } finally {
                btnElement.disabled = false;
            }
        }
        async function toggleTorExit() {
            const btn = document.getElementById('tor-exit-btn');
            if (!btn || btn.disabled) return;
            const isCurrentlyOn = btn.classList.contains('on');
            const newState = !isCurrentlyOn;
            btn.disabled = true;
            btn.classList.add('transitioning');

            try {
                const res = await fetch('/api/system/tor-exit', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({enable: newState})
                });
                if (!res.ok) throw new Error(await res.text());
                showToast(`Tor exit node ${newState ? 'activated' : 'disabled'}`, 'success');
                await Promise.all([fetchTorExitStatus(), fetchServices()]);
            } catch(e) {
                showToast(`Tor error: ${e.message || e}`, 'error');
            } finally {
                btn.classList.remove('transitioning');
                btn.disabled = false;
            }
        }

        async function fetchTorExitStatus() {
            if (CURRENT_USER && CURRENT_USER.role === 'guest') return;
            try {
                const res = await fetch('/api/system/tor-exit');
                if(!res.ok) return;
                const data = await res.json();
                const btn = document.getElementById('tor-exit-btn');
                const label = document.getElementById('tor-exit-label');
                if (!btn || !label) return;
                if (data.active || data.enabled) {
                    btn.classList.add('on');
                    label.textContent = 'Active';
                    label.style.color = 'var(--online)';
                } else {
                    btn.classList.remove('on');
                    label.textContent = 'Inactive';
                    label.style.color = 'var(--offline)';
                }
            } catch(e) {}
        }

        let CURRENT_USER = { role: 'viewer', is_owner: false };

        async function fetchCurrentUser() {
            try {
                const res = await fetch('/api/me');
                if (!res.ok) return;
                const u = await res.json();
                CURRENT_USER = u;

                const nameEl = document.getElementById('nav-user-name');
                const roleEl = document.getElementById('nav-user-role');
                const avatarEl = document.getElementById('nav-user-avatar');
                const pillEl = document.getElementById('nav-user-pill');

                const displayName = u.display_name || u.username || 'User';
                if (pillEl) pillEl.title = `${displayName} (${u.role || 'user'})`;
                if (nameEl) nameEl.textContent = displayName;
                if (avatarEl) {
                    if (u.avatar) {
                        avatarEl.innerHTML = `<img src="${u.avatar}" style="width:100%; height:100%; object-fit:cover;">`;
                    } else {
                        avatarEl.textContent = displayName.charAt(0).toUpperCase();
                    }
                }
                if (roleEl) {
                    if (u.role === 'owner') {
                        roleEl.textContent = '👑 Owner';
                        roleEl.style.color = '#AE9E5C';
                    } else if (u.role === 'admin') {
                        roleEl.textContent = '🛡️ Admin';
                        roleEl.style.color = 'var(--online)';
                    } else {
                        roleEl.textContent = '👁️ Viewer';
                        roleEl.style.color = 'var(--text-muted)';
                    }
                }

                // Guests (Kimi): Remove Tor exit banner
                if (u.role === 'guest') {
                    const torBanner = document.getElementById('tor-exit-banner');
                    if (torBanner) torBanner.remove();
                } else {
                    const torBtn = document.getElementById('tor-exit-btn');
                    if (torBtn && u.role === 'viewer') {
                        torBtn.disabled = true;
                        torBtn.title = 'Viewer: Read-only access';
                        torBtn.style.cursor = 'not-allowed';
                        torBtn.style.opacity = '0.5';
                    }
                }
            } catch(e) {}
        }

        // Global shortcuts
        window.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            if (e.key === 'r' || e.key === 'R') {
                fetchSystemStats(true);
                fetchServices();
            } else if (e.key === 's' || e.key === 'S') {
                window.location.href = '/settings';
            }
        });

        document.addEventListener('DOMContentLoaded', async () => {
            await fetchCurrentUser();
            fetchSystemStats();
            fetchServices();
            if (!CURRENT_USER || CURRENT_USER.role !== 'guest') {
                fetchTorExitStatus();
            }
            initTelemetryStream();
            // Fallback polling if SSE is disconnected or unsupported
            setInterval(() => {
                if (!sseActive && !document.hidden) {
                    fetchSystemStats();
                }
            }, 5000);
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) {
                    if (sseSource && sseSource.readyState === EventSource.CLOSED) {
                        initTelemetryStream();
                    }
                    if (!sseActive) fetchSystemStats();
                }
            });
        });
    </script>
</body>
</html>
